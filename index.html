/* ── Vorlagen ─────────────────────────────────────────────────────
   Bewusst grob: sie sollen einen Anfang geben, nicht einen Plan
   vortäuschen. Alles ist überschreibbar. */
function wendeVorlageAn(art){
  const b = bereich(projB); if(!b) return;
  const von = $('#p-von')?.value || todayISO();
  const ziel = $('#p-ziel')?.value.trim();
  const tag = n => { const d = new Date(von+'T00:00'); d.setDate(d.getDate()+n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

  if(art === 'leer'){ b.projekt = { von, bis: $('#p-bis')?.value || null, ziel: ziel||'' };
    persist(); closeSheet(); S.offenerBereich=b.id; S.bereichSpalte='zeit'; S.view='bereich'; render(); return; }

  const etp = art === 'einarbeitung'
    ? [
        ['Ankommen und Überblick gewinnen', 0, 6,
         ['Zugänge und Werkzeuge einrichten','Team kennenlernen','Bestehende Abläufe mitschreiben']],
        ['Erste eigene Aufgabe übernehmen', 7, 29,
         ['Aufgabe mit Führungskraft abstimmen','Erste Ergebnisse zeigen','Rückmeldung einholen']],
        ['Selbstständig arbeiten', 30, 59,
         ['Eigenen Verantwortungsbereich klären','Erste Verbesserung vorschlagen']],
        ['Verantwortung übernehmen', 60, 89,
         ['Ein Vorhaben eigenständig führen','Rückblick vorbereiten']],
      ]
    : [
        ['Lage klären', 0, 13, ['Ausgangssituation aufschreiben','Beteiligte und Mittel klären']],
        ['Erste Schritte gehen', 14, 44, ['Kleinsten möglichen Anfang machen']],
        ['Auf das Ziel zuarbeiten', 45, 89, []],
      ];

  const ms = art === 'einarbeitung'
    ? [['Erste Woche geschafft', 6], ['30 Tage', 30], ['60 Tage', 60], ['Probezeit im Blick', 89]]
    : [['Erster sichtbarer Fortschritt', 30], ['Ziel erreicht', 90]];

  b.projekt = { von, bis: art === 'einarbeitung' ? tag(89) : ($('#p-bis')?.value || null),
                ziel: ziel || (art === 'einarbeitung'
                  ? 'in den ersten drei Monaten selbstständig arbeiten kann' : '') };
  b.meilensteine = ms.map(([t,d]) => ({ id: uid(), text: t, datum: tag(d), erreicht: false }));

  // Vorhandene laufende Einsätze weichen — pro Bereich läuft genau einer
  S.items.filter(i => i.kind === 'einsatz' && i.bereich === b.id).forEach(i => i.aktiv = false);
  etp.forEach(([titel, a, z, schritte], i) => {
    const e = neuerEinsatz({
      bereich: b.id, title: titel,
      proof: '', aktiv: i === 0,
      von: tag(a), bis: tag(z), ord: i,
      steps: schritte.map(t => ({ id: uid(), text: t, done: false })),
    });
    S.items.push(e);
  });

  persist(); closeSheet();
  S.offenerBereich = b.id; S.bereichSpalte = 'zeit'; S.view = 'bereich'; render();
  say(`Vorlage übernommen — ${etp.length} Etappen angelegt`);
}

  const ziel = RB.tagesziel === '' ? 0 : Math.max(0, Math.round(+RB.tagesziel) || 0);

  if(RB.id){
    const r = item(RB.id);
    Object.assign(r, { title: titel, bereich: RB.bereich||null, einheit: RB.einheit.trim(),
      tagesziel: ziel, von: RB.von, bis: RB.bis, takt: [...RB.takt].sort() });

      einheit: RB.einheit.trim(), tagesziel: ziel, von: RB.von, bis: RB.bis,
      takt: [...RB.takt].sort() }));

  persist(); RB = null; closeSheet();
  say(RB === null ? 'Reihe gespeichert' : 'Angelegt');

      <input value="${esc(s.text)}" data-stext="${s.id}">
      <button class="sdel" data-sdel="${s.id}" aria-label="Entfernen">${svg('x')}</button>

    <div class="srow">

      <div class="opt-l">Bereich</div>

    <div class="opt">

    <div class="opt">
      <div class="opt-l">Termin</div>
      <input class="dinp" type="date" id="d-due" value="${it.due||''}">

    <div class="opt">
      <div class="opt-l">Wiederholung</div>
      <select class="pick" id="d-wdh">${Object.entries(WDH).map(([k,v]) =>

    <button class="ghost alertc" data-del="${it.id}">${svg('trash')}Löschen</button>

  $$('#sheet-b textarea').forEach(grow);

  $('#d-new')?.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const v = e.target.value.trim(); if(!v) return;
    commitDetail();
    const t = item(sheetID);
    t.steps = [...(t.steps||[]), {id:uid(), text:v, done:false}];
    beruehre(t); persist(); renderDetail();
    setTimeout(() => $('#d-new')?.focus(), 60);
  });
}

function commitDetail(){
  const it = item(sheetID); if(!it) return;
  const g = id => $('#'+id);
  const ti = g('d-title')?.value.trim();
  if(ti) it.title = ti;
  if(g('d-proof'))  it.proof  = g('d-proof').value.trim();
  if(g('d-reason')) it.reason = g('d-reason').value.trim();
  if(g('d-b') && g('d-b').value !== it.bereich){
    it.bereich = g('d-b').value;
    it.aktiv = false;                    // im neuen Bereich erst wieder wählen
  }
  const nd = g('d-due')?.value || null;
  if(nd !== (it.due || null)){
    const alt = it.lastDue || it.due;
    if(alt && nd && new Date(nd) > new Date(alt)) it.postponed = (it.postponed||0) + 1;
    it.due = nd; it.lastDue = nd;
  }
  $$('#sheet-b [data-stext]').forEach(inp => {
    const s = (it.steps||[]).find(x => x.id === inp.dataset.stext);
    if(s) s.text = inp.value;
  });
  beruehre(it); persist();
}

/* ═══════════════════════════════════════════════════════════════════
   WERTEINGABE
   
   Muss in zwei Sekunden erledigt sein, sonst wird sie nicht benutzt.
   Ohne Einheit schaltet ein Tipp direkt um — dieses Fenster öffnet
   sich nur, wenn tatsächlich eine Zahl gebraucht wird.
   ═══════════════════════════════════════════════════════════════════ */
let weR = null, weTag = null;

function oeffneWerteingabe(rid, tag){
  const r = item(rid); if(!r) return;
  weR = rid; weTag = tag;
  const d = new Date(tag + 'T00:00');
  $('#we-titel').textContent = r.title;
  $('#we-datum').textContent = `${WOCHENTAGE[d.getDay()]}, ${dfmtLang(tag)}`;
  $('#we-einheit').textContent = r.einheit || '';
  const bisher = reiheWert(r, tag);
  $('#we-feld').value = typeof bisher === 'number' ? bisher : '';

  // Häufige Werte dieser Reihe als Vorschlag — schneller als tippen
  const werte = Object.values(r.eintraege||{}).filter(v => typeof v === 'number');
  const haeufig = [...new Set(werte)]
    .map(v => ({v, n: werte.filter(x=>x===v).length}))
    .sort((a,b) => b.n-a.n).slice(0,4).map(x=>x.v).sort((a,b)=>a-b);
  $('#we-vorschlaege').innerHTML = haeufig.map(v =>
    `<button data-wev="${v}">${v}</button>`).join('') ||
    (r.tagesziel ? `<button data-wev="${r.tagesziel}">${r.tagesziel} · Ziel</button>` : '');

  $('#weing').classList.add('on');
  setTimeout(() => { $('#we-feld').focus(); $('#we-feld').select(); }, 80);
}
function schliesseWerteingabe(){ $('#weing').classList.remove('on'); weR = null; weTag = null; }
function speichereWerteingabe(){
  const r = item(weR); if(!r){ schliesseWerteingabe(); return; }
  const v = $('#we-feld').value.trim();
  const n = v === '' ? null : Math.max(0, Math.min(99999, Math.round(+v)));
  setzeReihe(r, weTag, (n === null || isNaN(n)) ? null : n);
  schliesseWerteingabe(); render();
}

/* ═══════════════════════════════════════════════════════════════════
   MELDUNGEN
   ═══════════════════════════════════════════════════════════════════ */
function say(msg, kind = 'ok', action = null){
  const dur = action ? 7000 : 2800;
  const el = document.createElement('div');
  el.className = 'say ' + kind;
  el.innerHTML = `${svg(kind === 'ok' ? 'check' : 'alert')}
    <span class="txt">${esc(msg)}</span>
    ${action ? `<button>${esc(action.label)}</button>` : ''}`;
  $('#says').appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 340); };
  const t = setTimeout(kill, dur);
  if(action) el.querySelector('button').onclick = () => { clearTimeout(t); action.fn(); kill(); };
}
const toast = say;

/* ═══════════════════════════════════════════════════════════════════
   EREIGNISSE
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const hit = s => e.target.closest(s);

  if(hit('[data-fxclose]')) return closeFocus();
  if(hit('[data-fxtoggle]')) return toggleFx();
  if(hit('[data-fxdone]')){ const id = fxID; stopFx(); closeFocus(); erledige(id); return; }
  const fs = hit('[data-fxstep]');
  if(fs){ toggleSchritt(fxID, fs.dataset.fxstep); if(navigator.vibrate) navigator.vibrate(10); return; }

  if(hit('#veil') || hit('[data-close]') || hit('#sheet-x')) return closeSheet();

  // ── Reihen ──
  const rt = hit('[data-rt]');
  if(rt){
    const [rid, tag] = rt.dataset.rt.split(':');
    const r = item(rid);
    if(r && r.einheit){ oeffneWerteingabe(rid, tag); }
    else if(r){
      const bisher = reiheWert(r, tag);
      setzeReihe(r, tag, bisher === undefined ? true : null);
      render();
    }
    return;
  }
  if(hit('#weing') && !hit('.we-box')) return schliesseWerteingabe();
  if(hit('#we-ok')) return speichereWerteingabe();
  if(hit('#we-loeschen')){ $('#we-feld').value=''; return speichereWerteingabe(); }
  const wev = hit('[data-wev]');
  if(wev){ $('#we-feld').value = wev.dataset.wev; return; }

  const raus = hit('[data-raus]');
  if(raus){
    S.settings.reiheOffen = S.settings.reiheOffen || {};
    const id = raus.dataset.raus;
    S.settings.reiheOffen[id] = !S.settings.reiheOffen[id];
    persist(); render(); return;
  }
  if(hit('[data-neuereihe]')) return oeffneNeueReihe();
  const rb = hit('[data-rbearb]');
  if(rb) return oeffneReiheBearb(rb.dataset.rbearb);
  if(hit('[data-rspeichern]')) return speichereReihe();
  const rtag = hit('[data-rtag]');
  if(rtag){
    const d = +rtag.dataset.rtag;
    RB.takt = RB.takt.includes(d) ? RB.takt.filter(x=>x!==d) : [...RB.takt, d];
    renderReiheBlatt(); return;
  }
  const rl = hit('[data-rloeschen]');
  if(rl){
    if(confirm('Diese Reihe mit allen Einträgen löschen?')){
      loesche(rl.dataset.rloeschen); RB = null; closeSheet();
    }
    return;
  }
  const rop = hit('[data-ropen]');
  if(rop) return oeffneReiheBearb(rop.dataset.ropen);

  const nav = hit('.nav-b');
  if(nav){ S.view = nav.dataset.v; render(); scrollTo({top:0,behavior:'smooth'}); return; }

  if(hit('#b-search')) return oeffneSuche();
  if(hit('#such-x') || e.target.id === 'suchov') return schliesseSuche();
  const si = hit('[data-sidx]');
  if(si) return waehleTreffer(+si.dataset.sidx);
  if(hit('#b-mode')) return toggleMode();
  if(hit('#b-layout')) return toggleLayout();
  if(hit('#b-back')){ S.view = 'stand'; render(); scrollTo({top:0}); return; }

  // Bereich öffnen — optional direkt auf eine bestimmte Spalte
  const bo = hit('[data-bopen]');
  if(bo){
    S.offenerBereich = bo.dataset.bopen;
    S.bereichSpalte = bo.dataset.sp || 'aktuell';
    S.view = 'bereich'; render(); scrollTo({top:0}); return;
  }
  const sp = hit('[data-sp]:not([data-bopen])');
  if(sp){ S.bereichSpalte = sp.dataset.sp; render(); return; }

  // Zustandswechsel auf der Bereichsseite
  const tr = hit('[data-toreserve]');
  if(tr){ const it = item(tr.dataset.toreserve); it.aktiv = false; beruehre(it); persist(); render();
    say('In die Reserve gelegt'); return; }
  const ro = hit('[data-reopen]');
  if(ro){ const it = item(ro.dataset.reopen);
    it.doneAt = null; beruehre(it);
    if(!aktiverEinsatz(it.bereich)) it.aktiv = true;
    persist(); S.bereichSpalte = it.aktiv ? 'aktuell' : 'reserve'; render();
    say(it.aktiv ? 'Wieder als Einsatz gesetzt' : 'Zurück in die Reserve'); return; }
  const go = hit('[data-goto]');
  if(go){ S.view = go.dataset.goto; render(); scrollTo({top:0}); return; }

  if(hit('#b-save') || hit('[data-export]')) return exportFile();
  if(hit('[data-import]')) return $('#fileinput').click();

  if(hit('#b-add')){
    if(S.view === 'klein'){ $('#q-in')?.focus(); return; }
    if(S.view === 'reihen'){ return oeffneNeueReihe(); }
    if(!S.bereiche.length){ neuerBereich('Erster Bereich'); }
    return openSheet('neu');
  }
  const ne = hit('[data-newe]');
  if(ne){
    const bid = ne.dataset.newe;
    const belegt = !!aktiverEinsatz(bid);
    C = null; closeSheet();
    setTimeout(() => {
      C = { title:'', proof:'', step:'', bereich: bid,
            aktivSetzen: !belegt,      // läuft schon einer, geht der neue in die Reserve
            heute:false, forced:false };
      openSheet('neu');
    }, 300);
    return;
  }
  if(hit('[data-newb]')){ const b = neuerBereich(); render();
    say(`„${b.name}" angelegt — Namen unter „Mehr" ändern`); return; }

  // ── Ziele ──
  const zn = hit('[data-zneu]');
  if(zn) return oeffneNeuesZiel(zn.dataset.zneu);
  const zb = hit('[data-zbearb]');
  if(zb){ const [bid,zid] = zb.dataset.zbearb.split(':'); return oeffneZielBearb(bid,zid); }
  if(hit('[data-zspeichern]')) return speichereZiel();
  const zl = hit('[data-zloeschen]');
  if(zl){
    const [bid,zid] = zl.dataset.zloeschen.split(':');
    const z = ziel(bid,zid);
    const n = zielEinsaetze(bid,zid).length;
    if(confirm(`Ziel „${z.titel}" löschen?${n?`\n\nDie ${n} zugehörigen Einsätze bleiben erhalten und verlieren nur die Zuordnung.`:''}`)){
      const b = bereich(bid);
      const snapZ = JSON.parse(JSON.stringify(z));
      const betroffen = S.items.filter(i => i.ziel === zid).map(i => i.id);
      b.ziele = b.ziele.filter(x => x.id !== zid);
      S.items.forEach(i => { if(i.ziel === zid) i.ziel = null; });
      persist(); ZB = null; closeSheet(); render();
      say('Ziel gelöscht', 'warn', {label:'Rückgängig', fn: () => {
        const b2 = bereich(bid);
        b2.ziele = [...b2.ziele, snapZ];
        betroffen.forEach(id => { const it = item(id); if(it) it.ziel = zid; });
        persist(); render();
      }});
    }
    return;
  }
  const zms = hit('[data-zms]');
  if(zms){
    const [bid,zid,mid] = zms.dataset.zms.split(':');
    const z = ziel(bid,zid);
    const m = (z?.meilensteine||[]).find(x => x.id === mid);
    if(m){ m.erreicht = !m.erreicht; persist(); render();
      if(m.erreicht) say(`Meilenstein erreicht: ${m.text}`); }
    return;
  }
  const zmn = hit('[data-zmsneu]');
  if(zmn){
    const [bid,zid] = zmn.dataset.zmsneu.split(':');
    const t = prompt('Meilenstein — was ist dann erreicht?');
    if(!t || !t.trim()) return;
    const d = prompt('Datum (JJJJ-MM-TT), leer lassen für ohne:', '');
    if(d && !/^\d{4}-\d{2}-\d{2}$/.test(d)) return say('Ungültiges Datum.', 'warn');
    const z = ziel(bid,zid);
    z.meilensteine = [...(z.meilensteine||[]),
      {id:uid(), text:t.trim().slice(0,200), datum:d||null, erreicht:false}];
    persist(); render(); say('Meilenstein gesetzt');
    return;
  }
  const ze = hit('[data-zeinsatz]');
  if(ze){
    const [bid,zid] = ze.dataset.zeinsatz.split(':');
    C = null; closeSheet();
    setTimeout(() => {
      C = { title:'', proof:'', step:'', bereich: bid, zielId: zid,
            aktivSetzen: !aktiverEinsatz(bid), heute:false, forced:false };
      openSheet('neu');
    }, 300);
    return;
  }

  // ── Projekte ──
  const pa = hit('[data-projektan]');
  if(pa) return oeffneProjekt(pa.dataset.projektan);
  const pb = hit('[data-projektbearb]');
  if(pb) return oeffneProjekt(pb.dataset.projektbearb);
  const ps = hit('[data-projektspeichern]');
  if(ps) return speichereProjekt(ps.dataset.projektspeichern);
  const pv = hit('[data-vorlage]');
  if(pv) return wendeVorlageAn(pv.dataset.vorlage);
  const px = hit('[data-projektaus]');
  if(px){
    const b = bereich(px.dataset.projektaus);
    if(confirm('Projekt aufheben? Etappen und Meilensteine bleiben als gewöhnliche Einsätze erhalten.')){
      b.projekt = null; b.meilensteine = [];
      persist(); closeSheet(); S.bereichSpalte = 'aktuell'; render();
      say('Projekt aufgehoben');
    }
    return;
  }
  const ne2 = hit('[data-neueetappe]');
  if(ne2){
    const bid = ne2.dataset.neueetappe;
    C = null; closeSheet();
    setTimeout(() => {
      C = { title:'', proof:'', step:'', bereich: bid, etappe: true,
            aktivSetzen: !aktiverEinsatz(bid), heute:false, forced:false };
      openSheet('neu');
    }, 300);
    return;
  }
  const nm = hit('[data-neuerms]');
  if(nm){
    const b = bereich(nm.dataset.neuerms);
    const t = prompt('Meilenstein — was ist dann erreicht?');
    if(!t || !t.trim()) return;
    const d = prompt('Datum (JJJJ-MM-TT):', isoAdd(30));
    if(!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return say('Ungültiges Datum.', 'warn');
    b.meilensteine = [...(b.meilensteine||[]), {id:uid(), text:t.trim().slice(0,200), datum:d, erreicht:false}];
    persist(); render(); say('Meilenstein gesetzt');
    return;
  }
  const msk = hit('[data-ms]');
  if(msk){
    const b = bereich(S.offenerBereich);
    const m = (b?.meilensteine||[]).find(x => x.id === msk.dataset.ms);
    if(m){ m.erreicht = !m.erreicht; persist(); render();
      if(m.erreicht) say(`Meilenstein erreicht: ${m.text}`); }
    return;

  const sw = hit('[data-switch]');
  if(sw){ return oeffneWechsel(sw.dataset.switch); }
  const pk = hit('[data-pick]');
  if(pk){
    setzeAktiv(pk.dataset.pick);
    if(sheetMode) closeSheet();
    else {

      // den man gerade benutzt hat.
      if(S.bereichSpalte !== 'zeit') S.bereichSpalte = 'aktuell';

  const sa = hit('[data-setaktiv]');
  if(sa){ const it = item(sa.dataset.setaktiv);
    if(it.aktiv){ it.aktiv = false; persist(); } else setzeAktiv(it.id);
    renderDetail(); return; }

  const fx = hit('[data-focus]');
  if(fx){ e.stopPropagation(); return openFocus(fx.dataset.focus); }
  const ff = hit('[data-fxfrom]');
  if(ff){ const id = ff.dataset.fxfrom; commitDetail(); closeSheet(); return openFocus(id); }

  const dn = hit('[data-done]');
  if(dn){ e.stopPropagation();
    const it = item(dn.dataset.done);
    if(it?.doneAt) zurueck(it.id); else erledige(dn.dataset.done);
    if(navigator.vibrate) navigator.vibrate(12); return; }

  const hb = hit('[data-heute]');
  if(hb){ e.stopPropagation(); toggleHeute(hb.dataset.heute);
    if(sheetMode === 'detail') renderDetail(); return; }

  const st = hit('[data-step]');
  if(st){ const [a,b] = st.dataset.step.split(':'); return toggleSchritt(a,b); }
  const sd = hit('[data-sdel]');
  if(sd){ commitDetail(); const it = item(sheetID);
    it.steps = (it.steps||[]).filter(x => x.id !== sd.dataset.sdel);
    persist(); renderDetail(); return; }

  const op = hit('[data-open]');

  const vb = hit('[data-verb]');
  if(vb){ C.title = (C.title.trim() ? C.title.trim()+' ' : '') + vb.dataset.verb;
    C.forced = false; renderCompose(); setTimeout(() => $('#f-title')?.focus(), 50); return; }
  const dv = hit('[data-dverb]');
  if(dv){ commitDetail(); const it = item(sheetID);
    it.title = (it.title.trim() ? it.title.trim()+' ' : '') + dv.dataset.dverb;
    persist(); renderDetail(); return; }

  if(hit('#f-ok')) return erstelle();
  if(hit('#f-aktiv')){ C.aktivSetzen = !C.aktivSetzen; C.bTouched = true; renderCompose(); return; }

  const tg = hit('[data-tg]');
  if(tg){ S.settings.tagesgrenze = clamp((S.settings.tagesgrenze||3) + (+tg.dataset.tg), 1, 12);
    persist(); render(); return; }
  const rz = hit('[data-rz]');
  if(rz){ S.settings.rueckZeit = +rz.dataset.rz; persist(); render(); return; }
  const kf = hit('[data-kf]');
  if(kf){ S.settings.kleinFilter = kf.dataset.kf; persist(); render(); return; }
  if(hit('#q-ok')) return schnellEintrag();

  const bd = hit('[data-bdel]');
  if(bd){ const b = bereich(bd.dataset.bdel);
    if(confirm(`„${b.name}" mit allen Einsätzen löschen?`)) loescheBereich(bd.dataset.bdel);
    return; }
  const bc = hit('[data-bcolor]');
  if(bc){ const b = bereich(bc.dataset.bcolor);
    b.ci = ((b.ci||0)+1) % BEREICH_FARBEN.length; persist(); render(); return; }

  if(hit('[data-sichernspaeter]')){ S.settings.sichernSpaeter = todayISO(); persist(); render(); return; }
  if(hit('[data-dismiss]')){ S.settings.lastOpen = new Date().toISOString(); persist(); render(); return; }

  if(hit('[data-neuladen]')){
    (async () => {
      try{
        writeNow();   // Daten vorher sichern — sie liegen im localStorage, nicht im Cache
        if('caches' in window){
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if('serviceWorker' in navigator){
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
      }catch{}
      location.reload(true);
    })();
    return;
  }
  const bk = hit('[data-bak]');
  if(bk) return restoreBak(+bk.dataset.bak);
});

document.addEventListener('input', e => {
  if(e.target.id === 'q-in'){
    const ok = $('#q-ok'); if(ok) ok.disabled = !e.target.value.trim();
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'such-q'){ suchSel = 0; renderSuche(); }
});
document.addEventListener('keydown', e => {
  const suchOffen = $('#suchov').classList.contains('on');
  if(suchOffen){
    if(e.key === 'ArrowDown'){ e.preventDefault(); suchSel = clamp(suchSel+1, 0, suchTreffer.length-1); renderSuche(); return; }
    if(e.key === 'ArrowUp'){   e.preventDefault(); suchSel = clamp(suchSel-1, 0, suchTreffer.length-1); renderSuche(); return; }
    if(e.key === 'Enter'){     e.preventDefault(); waehleTreffer(suchSel); return; }
    if(e.key === 'Escape'){    e.preventDefault(); schliesseSuche(); return; }
    return;
  }
  if(e.target.id === 'q-in' && e.key === 'Enter'){ e.preventDefault(); schnellEintrag(); return; }
  if(e.key === 'Escape'){
    if($('#weing').classList.contains('on')) return schliesseWerteingabe();
    if(fxID) return closeFocus();
    if(sheetMode) return closeSheet();
  }
  if(e.key === 'Enter' && $('#weing').classList.contains('on') && e.target.id === 'we-feld'){
    e.preventDefault(); return speichereWerteingabe();
  }
  // Auf dem Laptop: / öffnet die Suche
  const tippt = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(!tippt && !sheetMode && !fxID && (e.key === '/' || ((e.metaKey||e.ctrlKey) && e.key === 'k'))){
    e.preventDefault(); oeffneSuche();
  }
});
/* Bereichsnamen bei jedem Tastendruck übernehmen.
   Das change-Ereignis feuert erst beim Verlassen des Feldes — geht dabei
   ein Neuzeichnen dazwischen, war die Eingabe verloren. */
let nameT = null;
document.addEventListener('input', e => {
  const bn = e.target.closest('[data-bname]');
  if(!bn) return;
  const b = bereich(bn.dataset.bname);
  if(!b) return;
  const v = bn.value.slice(0,60);
  b.name = v;                       // sofort in den Zustand
  clearTimeout(nameT);
  nameT = setTimeout(() => {
    const bb = bereich(bn.dataset.bname);
    if(bb && !bb.name.trim()) bb.name = 'Bereich';
    persist();
    // Seitenleiste und Kopfzeile nachziehen, ohne das Feld zu zerstören
    renderNavExtra();
    if(S.view === 'bereich' && S.offenerBereich === bn.dataset.bname){
      const c = $('#crumb'); if(c) c.textContent = bb.name;
    }
  }, 400);
});
document.addEventListener('blur', e => {
  const bn = e.target.closest?.('[data-bname]');
  if(!bn) return;
  const b = bereich(bn.dataset.bname);
  if(b && !b.name.trim()){ b.name = 'Bereich'; bn.value = b.name; persist(); }
}, true);

function schnellEintrag(){
  const inp = $('#q-in'); if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  S.items.push(neuerKleinkram(v));
  persist();
  inp.value = '';
  render();
  setTimeout(() => { const n = $('#q-in'); if(n) n.focus(); }, 60);
}

/* ═══════════════════════════════════════════════════════════════════
   BLATT ZIEHEN
   Am Balken nach unten ziehen schließt das Blatt. Auf dem Telefon ist
   das die erwartete Geste — der Schließen-Knopf allein reicht nicht.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  let y0 = null, dy = 0;
  const sheet = () => $('#sheet');
  const hold  = () => $('#hold');

  function start(e){
    if(!sheetMode) return;
    y0 = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = 0;
    sheet().classList.add('dragging');
  }
  function move(e){
    if(y0 === null) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = Math.max(0, y - y0);
    sheet().style.transform = `translateY(${dy}px)`;
    if(e.cancelable) e.preventDefault();
  }
  function end(){
    if(y0 === null) return;
    const el = sheet();
    el.classList.remove('dragging');
    el.style.transform = '';
    y0 = null;
    if(dy > 110) closeSheet();
  }

  document.addEventListener('touchstart', e => { if(e.target.closest('#hold')) start(e); }, {passive:true});
  document.addEventListener('touchmove',  e => { if(y0 !== null) move(e); }, {passive:false});
  document.addEventListener('touchend',   end);
  document.addEventListener('mousedown',  e => { if(e.target.closest('#hold')) start(e); });
  document.addEventListener('mousemove',  e => { if(y0 !== null) move(e); });
  document.addEventListener('mouseup',    end);
})();

/* Fokussiertes Feld ins Sichtfeld holen, wenn die Tastatur aufgeht. */
document.addEventListener('focusin', e => {
  const f = e.target.closest('#sheet-b textarea, #sheet-b input');
  if(!f) return;
  setTimeout(() => f.scrollIntoView({block:'center', behavior:'smooth'}), 320);
});

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ writeNow(); return; }
  applyPhase(); tageswechsel(); render();
});
setInterval(applyPhase, 6e5);

/* ═══════════════════════════════════════════════════════════════════
   ZWISCHENSTÄNDE
   ═══════════════════════════════════════════════════════════════════ */
function restoreBak(i){
  let list = [];
  try { list = JSON.parse(localStorage.getItem(BAK) || '[]'); } catch {}
  const b = list[i]; if(!b) return;
  if(!confirm(`Stand vom ${new Date(b.at).toLocaleString('de-DE')} laden?\n\nDer aktuelle Stand wird vorher gesichert.`)) return;
  try{
    const p = JSON.parse(b.data);
    if(!validState(p)) throw new Error();
    writeNow();
    S.bereiche = p.bereiche; S.items = p.items;
    S.settings = Object.assign(S.settings, p.settings || {});
    persist(); tageswechsel(); render();
    say('Zwischenstand geladen');
  }catch{ say('Zwischenstand ist beschädigt.', 'err'); }
}

/* ═══════════════════════════════════════════════════════════════════
   START
   ═══════════════════════════════════════════════════════════════════ */
let booted = false, markT = null;

function boot(){
  applyPhase(); hydrate(); initField();
  applyLayout(); applyMode();

  const loaded = readState();
  if(loaded){
    S.bereiche = loaded.bereiche || [];
    S.items    = loaded.items || [];
    S.settings = Object.assign(S.settings, loaded.settings || {});
    // Ältere Sicherung ohne Kennzeichen: rückwirkend aus den Daten schätzen,
    // statt fälschlich „seit heute" zu zeigen — das wäre bei einer echten,
    // langjährigen Installation genau die falsche Alarmierung.
    if(!S.settings.instanzSeit){
      const daten = [...S.bereiche, ...S.items].map(x => x.erstelltAm || x.createdAt).filter(Boolean).sort();
      S.settings.instanzSeit = daten[0] || new Date().toISOString();
    }
  } else {
    erstStart();
    S.settings.instanzSeit = new Date().toISOString();
  }

  try{
    const m = JSON.parse(localStorage.getItem(META) || 'null');
    if(m?.lastSaved) lastSaved = m.lastSaved;
  }catch{}

  migriereZuZielen();
  tageswechsel();
  render();
  dirty = false; booted = true;
  if(!storageOK) updateSaveBadge();

  // Öffnungszeitpunkt erst NACH dem Rendern setzen, sonst wäre der
  // Wiedereinstieg schon beim ersten Blick verschwunden.
  setTimeout(() => {
    S.settings.lastOpen = new Date().toISOString();
    writeNow();                 // still — kein Nutzerhinweis für Buchhaltung
  }, 2000);

  $('#fileinput').addEventListener('change', e => {
    const f = e.target.files?.[0]; if(f) importFile(f); e.target.value = '';
  });

  setTimeout(() => {
    while(toastQueue.length){ const t = toastQueue.shift(); say(t.msg, t.kind); }
    if(!storageOK) say('Dieses Gerät speichert nicht dauerhaft. Sichere als Datei.', 'err');
  }, 900);

  setInterval(() => {
    if(dirty && lastSaved && Date.now() - lastSaved > 864e5){
      say('Länger nicht gesichert.', 'warn', {label:'Sichern', fn: exportFile});
      lastSaved = Date.now();
    }
  }, 6e5);
}

function erstStart(){
  const a = neuerBereich('Startup');
  const b = neuerBereich('Lernen');
  const c = neuerBereich('Privat');
  const e1 = neuerEinsatz({
    bereich: a.id, aktiv: true,
    title: 'Stand eine Woche lang benutzen',
    proof: 'für jeden Bereich einen Einsatz festgelegt habe',
    steps: [
      {id:uid(), text:'Bereiche unter „Mehr" umbenennen', done:false},
      {id:uid(), text:'Pro Bereich einen Einsatz setzen', done:false},
      {id:uid(), text:'Eine Sicherung herunterladen', done:false},
    ],
  });
  S.items.push(e1);
  S.items.push(neuerKleinkram('Beispiel: etwas Kleines, das keinen Nachweis braucht'));
  persist();
}

/**
 * Zustand der Sicherung am Knopf selbst, nicht als schwebende Marke.
 * Ein Overlay über dem Inhalt kostet mehr, als es an Information bringt.
 */
function updateSaveBadge(){
  const b = $('#b-save'); if(!b) return;
  b.classList.toggle('unsaved', dirty && storageOK);
  b.classList.toggle('nostore', !storageOK);
  b.title = !storageOK ? 'Kein Gerätespeicher — unbedingt sichern'
          : dirty ? 'Nicht gesichert' : 'Gesichert';
}

boot();

/* Offline-Fähigkeit — greift nur, wenn die App über eine Adresse läuft.
   Bei lokal geöffneten Dateien ist der Dienst nicht erlaubt und wird
   stillschweigend übersprungen. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
