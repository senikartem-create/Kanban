/* ═══════════════════════════════════════════════════════════════════
   REIHEN · immer gleiche Tätigkeit über einen Zeitraum
   
   Bewusst OHNE Serienzählung. Eine Lücke ist eine Lücke, kein Bruch.
   Die Erkenntnis liegt in der Entwicklung des Wertes, nicht in
   Lückenlosigkeit — und die ist robust gegen Pausen.
   ═══════════════════════════════════════════════════════════════════ */
const WOCHENTAGE = ['So','Mo','Di','Mi','Do','Fr','Sa'];

function neueReihe(o){
  const now = new Date().toISOString();
  return Object.assign({
    id: uid(), kind: 'reihe', bereich: null,
    title: '', proof: '', reason: '', steps: [],
    einheit: '',            // '' = nur Häkchen, sonst z. B. 'Wiederholungen'
    tagesziel: 0,           // 0 = keins
    takt: [0,1,2,3,4,5,6],  // Wochentage, an denen sie fällig ist
    von: todayISO(), bis: isoAdd(29),
    eintraege: {},          // 'JJJJ-MM-TT' → Zahl (oder true ohne Einheit)
    aktiv: false, wdh: 'nie', due: null, heute: false, heuteTag: null,
    postponed: 0, lastDue: null, trk: 0,
    beruehrt: now, createdAt: now, startedAt: null, doneAt: null, archived: false,
  }, o);
}

const reihen = () => S.items.filter(i => i.kind === 'reihe' && !i.archived);

/** Alle Tage des Zeitraums, die zum Takt passen. */
function reiheTage(r){
  const out = [];
  const d = new Date(r.von + 'T00:00');
  const ende = new Date(r.bis + 'T00:00');
  let schutz = 0;
  while(d <= ende && schutz++ < 800){
    if((r.takt || [0,1,2,3,4,5,6]).includes(d.getDay())){
      out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    }
    d.setDate(d.getDate() + 1);
  }
  return out;
}

const reiheLaeuft = r => todayISO() >= r.von && todayISO() <= r.bis;
const reiheHeuteFaellig = r =>
  reiheLaeuft(r) && (r.takt || [0,1,2,3,4,5,6]).includes(new Date().getDay());
const reiheWert = (r, tag) => r.eintraege?.[tag];

function setzeReihe(r, tag, wert){
  r.eintraege = r.eintraege || {};
  if(wert === null || wert === undefined || wert === false) delete r.eintraege[tag];
  else r.eintraege[tag] = wert;
  beruehre(r);
  // Zählt am Tag des Eintrags, nicht am heutigen — Nachtragen soll die
  // Aufmerksamkeitsverteilung nicht verfälschen.
  S.tage = S.tage || {};
  S.tage[tag] = S.tage[tag] || {};
  const k = r.bereich || 'klein';
  S.tage[tag][k] = (S.tage[tag][k] || 0) + (wert === null ? 0 : 1);
  persist();
}

/**
 * Auswertung. Zeigt Entwicklung statt Vollständigkeit — und nennt
 * bewusst keine Serienlänge.
 */
function reiheBilanz(r){
  const tage = reiheTage(r);
  const heute = todayISO();
  const faellig = tage.filter(t => t <= heute);
  const eingetragen = faellig.filter(t => reiheWert(r, t) !== undefined);
  const werte = eingetragen.map(t => reiheWert(r, t)).filter(v => typeof v === 'number');

  const summe = werte.reduce((a, x) => a + x, 0);
  const schnitt = werte.length ? summe / werte.length : 0;

  // Entwicklung: erste gegen zweite Hälfte der eingetragenen Werte
  let entwicklung = null;
  if(werte.length >= 6){
    const h = Math.floor(werte.length / 2);
    const a = werte.slice(0, h), b = werte.slice(-h);
    const ma = a.reduce((x, y) => x + y, 0) / a.length;
    const mb = b.reduce((x, y) => x + y, 0) / b.length;
    if(ma > 0){
      entwicklung = { frueh: Math.round(ma), spaet: Math.round(mb),
        richtung: mb > ma * 1.12 ? 'hoch' : mb < ma * 0.88 ? 'runter' : 'gleich' };
    }
  }

  return {
    tageGesamt: tage.length, faellig: faellig.length,
    eingetragen: eingetragen.length,
    summe, schnitt: Math.round(schnitt * 10) / 10,
    entwicklung,
    zielErreicht: r.tagesziel ? werte.filter(v => v >= r.tagesziel).length : null,
    vorbei: heute > r.bis,
  };
}

function neuerKleinkram(title, due){
  const now = new Date().toISOString();
  return {
    id: uid(), kind: 'klein', bereich: null,
    title: title.trim().slice(0, 300),
    proof: '', reason: '', steps: [],
    aktiv: false, due: due || null, heute: false, heuteTag: null,
    postponed: 0, lastDue: due || null, trk: 0,
    beruehrt: now, createdAt: now, startedAt: null, doneAt: null, archived: false,
  };
}

/* ── Zugriff ────────────────────────────────────────────────────── */
const bereich = id => S.bereiche.find(b => b.id === id);
const item = id => S.items.find(i => i.id === id);
const sortBereiche = () => [...S.bereiche].sort((a,b) => (a.ord||0) - (b.ord||0));

const einsaetze = () => S.items.filter(i => i.kind === 'einsatz' && !i.archived);
const kleinkram = () => S.items.filter(i => i.kind === 'klein' && !i.archived);

/** Der eine aktive Einsatz eines Bereichs. */
const aktiverEinsatz = bid =>
  einsaetze().find(i => i.bereich === bid && i.aktiv && !i.doneAt);

/** Wartende Einsätze eines Bereichs — angelegt, aber nicht aktiv. */
const wartende = bid =>
  einsaetze().filter(i => i.bereich === bid && !i.aktiv && !i.doneAt);

/** Abgeschlossene Einsätze eines Bereichs — der sichtbare Rückstand. */
const erledigte = bid =>
  S.items.filter(i => i.kind === 'einsatz' && i.bereich === bid && i.doneAt);

const naechsterSchritt = it => (it.steps || []).find(s => !s.done);

/* ── Projekte ─────────────────────────────────────────────────────
   Eine Etappe IST ein Einsatz mit Zeitraum. Damit gilt weiterhin:
   pro Bereich läuft genau einer. Die Zeitachse ist eine zweite Sicht
   auf dieselben Daten, keine zweite Datenhaltung. */
const istProjekt = b => !!(b && b.projekt);

/** Etappen eines Projekts in zeitlicher Reihenfolge. */
function etappen(bid, zid){
  return S.items
    .filter(i => i.kind === 'einsatz' && i.bereich === bid && !i.archived && (i.von || i.bis)
      && (zid === undefined || i.ziel === zid))
    .sort((a,b) => {
      const av = a.von || a.bis || '9999', bv = b.von || b.bis || '9999';
      if(av !== bv) return av < bv ? -1 : 1;
      return (a.ord||0) - (b.ord||0);
    });
}

/** Zeitspanne des Projekts — aus Angabe oder aus den Etappen abgeleitet. */
function projektSpanne(b){
  if(!istProjekt(b)) return null;
  const et = etappen(b.id);
  const daten = et.flatMap(e => [e.von, e.bis]).filter(Boolean)
    .concat((b.meilensteine||[]).map(m => m.datum).filter(Boolean));
  const von = b.projekt.von || daten.sort()[0] || todayISO();
  let bis = b.projekt.bis;
  if(!bis){
    const spaet = daten.sort().slice(-1)[0];
    bis = spaet && spaet > von ? spaet : isoAdd(30);
  }
  return { von, bis, offen: !b.projekt.bis };
}

/** Anteil erledigter Etappen und Schritte — beides zählt. */
function projektFortschritt(bid){
  const et = etappen(bid);
  if(!et.length) return { etappen:0, gesamt:0, anteil:0, schritte:0, schritteGesamt:0 };
  const fertig = et.filter(e => e.doneAt).length;
  const sg = et.reduce((a,e) => a + (e.steps||[]).length, 0);
  const sf = et.reduce((a,e) => a + schritteFertig(e), 0);
  const anteil = sg ? (fertig + sf/Math.max(1,sg)) / (et.length + 1) : fertig/et.length;
  return { etappen:fertig, gesamt:et.length, anteil:Math.min(1,anteil), schritte:sf, schritteGesamt:sg };
}

/** Liegt der heutige Tag im Plan? Vergleicht Soll- mit Ist-Fortschritt. */
function planLage(b){
  const sp = projektSpanne(b);
  if(!sp) return null;
  const t0 = new Date(sp.von+'T00:00'), t1 = new Date(sp.bis+'T00:00'), jetzt = new Date(todayISO()+'T00:00');
  const gesamt = Math.max(1, (t1-t0)/864e5);
  const soll = Math.min(1, Math.max(0, (jetzt-t0)/864e5 / gesamt));
  const ist = projektFortschritt(b.id).anteil;
  const diff = ist - soll;
  return { soll, ist, diff,
           lage: Math.abs(diff) < .08 ? 'plan' : diff > 0 ? 'vor' : 'hinter' };
}

const schritteFertig = it => (it.steps || []).filter(s => s.done).length;

/* ── Zeit seit letzter Bewegung ─────────────────────────────────── */
function tageSeit(iso){
  if(!iso) return null;
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
  return Math.max(0, d);
}

/** Wann wurde in diesem Bereich zuletzt etwas bewegt? */
function bereichBeruehrt(bid){
  const alle = S.items.filter(i => i.bereich === bid);
  if(!alle.length) return null;
  return alle.map(i => i.beruehrt || i.createdAt)
             .sort().reverse()[0];
}

function beruehre(it){
  it.beruehrt = new Date().toISOString();
  const t = todayISO();
  S.tage = S.tage || {};
  S.tage[t] = S.tage[t] || {};
  const k = it.bereich || 'klein';
  S.tage[t][k] = (S.tage[t][k] || 0) + 1;
  // Älter als ein Jahr wird verworfen — der Rückblick reicht nicht weiter
  const grenze = isoAdd(-400);
  Object.keys(S.tage).forEach(d => { if(d < grenze) delete S.tage[d]; });
}

/** Wortlaut für „zuletzt vor …" — bewusst sachlich, ohne Wertung. */
function seitText(iso){
  const t = tageSeit(iso);
  if(t === null) return 'noch nichts';
  if(t === 0) return 'heute';
  if(t === 1) return 'gestern';
  if(t < 14) return `vor ${t} Tagen`;
  if(t < 31) return `vor ${Math.floor(t/7)} Wochen`;
  if(t < 60) return 'vor einem Monat';
  return `vor ${Math.floor(t/30)} Monaten`;
}

/** Ab wann gilt ein Bereich als liegengeblieben. */
const SCHWELLE = 10;
const istLiegend = bid => (tageSeit(bereichBeruehrt(bid)) ?? 0) >= SCHWELLE;

/* ── Heute ──────────────────────────────────────────────────────── */
const istHeute = it => it.heute && it.heuteTag === todayISO();

function heuteKram(){
  return kleinkram()
    .filter(i => !i.doneAt && (istHeute(i) || isTodayDue(i.due) || isOver(i.due)))
    .sort((a,b) => (dayDiff(a.due) ?? 99) - (dayDiff(b.due) ?? 99));
}

function offenerKram(){
  return kleinkram().filter(i => !i.doneAt);
}

function ueberfaelligerKram(){
  return kleinkram().filter(i => !i.doneAt && isOver(i.due));
}

/* ── Tageswechsel ───────────────────────────────────────────────── */
function tageswechsel(){
  const key = todayISO();
  if(S.settings._roll === key) return;
  S.settings._roll = key;
  let n = 0;
  S.items.forEach(i => {
    if(i.heute && i.heuteTag !== key){ i.heute = false; i.heuteTag = null; n++; }
  });
  if(n) persist();
}

/* ── Wiedereinstieg ─────────────────────────────────────────────── */
/**
 * Der kritische Moment ist nicht der Dienstagmorgen, sondern der Tag nach
 * drei Wochen Pause. Dann soll die App orientieren, nicht anklagen.
 */
function pauseTage(){
  return tageSeit(S.settings.lastOpen);
}
function zeigeWiedereinstieg(){
  const p = pauseTage();
  return p !== null && p >= 4 && (einsaetze().length > 0 || offenerKram().length > 0);
}



/* ═══════════════════════════════════════════════════════════════════
   AUSWERTUNG
   
   Rechnet ausschließlich auf vorhandenen Feldern plus dem Tageszähler.
   Jede Funktion liefert entweder eine belegte Aussage oder null —
   niemals eine Behauptung ohne Grundlage.
   ═══════════════════════════════════════════════════════════════════ */
const WDH = { nie:'Keine', taeglich:'Täglich', woechentlich:'Wöchentlich', monatlich:'Monatlich' };
const WDH_TAGE = { taeglich:1, woechentlich:7, monatlich:30 };

const ZEITRAEUME = { 30:'30 Tage', 90:'90 Tage', 0:'insgesamt' };

function tageImRaum(n){
  const von = n ? isoAdd(-n) : '0000';
  return Object.entries(S.tage || {}).filter(([d]) => d >= von);
}

/** Bewegungstage je Bereich im Zeitraum. */
function aufmerksamkeit(n){
  const zaehler = {};
  tageImRaum(n).forEach(([d, pro]) => {
    Object.keys(pro).forEach(k => { zaehler[k] = (zaehler[k] || 0) + 1; });
  });
  return sortBereiche()
    .map(b => ({ b, tage: zaehler[b.id] || 0 }))
    .sort((x, y) => y.tage - x.tage);
}

/** An wie vielen Tagen wurde überhaupt etwas bewegt. */
function rhythmus(n){
  const tage = tageImRaum(n).length;
  const spanne = n || Math.max(1, Object.keys(S.tage || {}).length ? 
    Math.round((Date.now() - new Date(Object.keys(S.tage).sort()[0]+'T00:00')) / 864e5) + 1 : 1);
  return { tage, spanne, anteil: spanne ? tage / spanne : 0 };
}

/** Abgeschlossene Einsätze im Zeitraum. */
function abschluesse(n){
  const von = n ? isoAdd(-n) : '0000';
  return S.items.filter(i =>
    i.kind === 'einsatz' && i.doneAt && i.doneAt.slice(0,10) >= von);
}

/** Durchlaufzeiten — nur mit genug Fällen aussagekräftig. */
function durchlauf(n){
  const d = abschluesse(n)
    .filter(i => i.startedAt && i.doneAt)
    .map(i => Math.max(0, Math.round((new Date(i.doneAt) - new Date(i.startedAt)) / 864e5)));
  if(d.length < 4) return { faelle: d.length, genug: false };
  const sortiert = [...d].sort((a,b) => a-b);
  const mittel = Math.round(d.reduce((a,x) => a+x, 0) / d.length);
  const median = sortiert[Math.floor(sortiert.length/2)];
  const letzte = d.slice(-3);
  const letztesMittel = Math.round(letzte.reduce((a,x)=>a+x,0) / letzte.length);
  return { faelle: d.length, genug: true, mittel, median,
           letztesMittel, trend: letztesMittel > mittel * 1.4 ? 'langsamer'
                              : letztesMittel < mittel * 0.7 ? 'schneller' : 'gleich' };
}

/** Aufgeschoben und doch gemacht gegenüber liegengeblieben. */
function aufschub(){
  const alle = S.items.filter(i => i.kind !== 'klein' || true).filter(i => (i.postponed||0) >= 2);
  const gemacht = alle.filter(i => i.doneAt);
  const offen = alle.filter(i => !i.doneAt && !i.archived)
    .sort((a,b) => (b.postponed||0) - (a.postponed||0));
  return { gesamt: alle.length, gemacht: gemacht.length, offen };
}

/** Was liegt am längsten still — und ist das ein Muster? */
function laengstStill(){
  const bs = sortBereiche().map(b => ({ b, t: tageSeit(bereichBeruehrt(b.id)) }))
    .filter(x => x.t !== null)
    .sort((x,y) => y.t - x.t);
  if(!bs.length) return null;
  const spitze = bs[0];
  // Muster: hatte dieser Bereich auch in den 90 Tagen davor am wenigsten?
  const frueher = aufmerksamkeit(90);
  const letzter = frueher.length ? frueher[frueher.length-1].b.id : null;
  return { ...spitze, muster: letzter === spitze.b.id };
}

/* ═══════════════════════════════════════════════════════════════════
   LAYOUT · schmal oder breit
   
   Ab 900 px automatisch breit. Die Wahl lässt sich erzwingen und wird
   gemerkt — beide Ansichten arbeiten auf denselben Daten.
   ═══════════════════════════════════════════════════════════════════ */
const FASSUNG = '14 · Instanzkennzeichen';
const BREITE = 900;

function layoutAuto(){ return innerWidth >= BREITE; }
function istBreit(){
  const w = S.settings.layout;          // 'auto' | 'wide' | 'compact'
  if(w === 'wide') return true;
  if(w === 'compact') return false;
  return layoutAuto();
}
function applyLayout(){
  const breit = istBreit();
  document.body.classList.toggle('wide', breit);
  const b = $('#b-layout');
  if(b){
    b.innerHTML = svg(breit ? 'phone' : 'layout');
    b.title = breit ? 'Zur kompakten Ansicht' : 'Zur breiten Ansicht';
  }
  return breit;
}
function applyMode(){
  const b = $('#b-mode');
  if(b){
    const hell = istHell();
    b.innerHTML = svg(hell ? 'moon' : 'sun');
    b.title = hell ? 'Zur dunklen Ansicht' : 'Zur hellen Ansicht';
  }
}
function toggleMode(){
  document.body.style.transition = 'background 260ms var(--ease), color 260ms var(--ease)';
  S.settings.modus = istHell() ? 'dunkel' : 'hell';
  persist(); applyPhase(); applyMode(); render();
  setTimeout(() => { document.body.style.transition = ''; }, 400);
  say(istHell() ? 'Helle Ansicht' : 'Dunkle Ansicht');
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if((S.settings.modus || 'auto') === 'auto'){ applyPhase(); applyMode(); render(); }
});

function toggleLayout(){
  S.settings.layout = istBreit() ? 'compact' : 'wide';
  persist(); applyLayout(); render();
  say(istBreit() ? 'Breite Ansicht' : 'Kompakte Ansicht');
}
addEventListener('resize', () => {
  if((S.settings.layout || 'auto') !== 'auto') return;
  const war = document.body.classList.contains('wide');
  if(applyLayout() !== war) render();
});

const KRUME = { stand:'Stand', heute:'Heute', klein:'Kleinkram', reihen:'Reihen', rueck:'Rückblick', mehr:'Mehr', bereich:'' };

function render(){
  const v = S.view;
  const b = v === 'bereich' ? bereich(S.offenerBereich) : null;
  $('#crumb').textContent = b ? b.name : v === 'stand' ? 'Stand' : KRUME[v];
  $('#crumb').style.color = b ? bFarbe(b.ci) : '';
  $('#crumb').classList.toggle('logo', v === 'stand' && !b);
  $$('.nav-b').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  $('#b-add').style.display = (v === 'mehr' || v === 'rueck') ? 'none' : '';
  $('#b-add').setAttribute('data-view', v);
  $('#b-back').style.display = (v === 'bereich') ? '' : 'none';

  const m = $('#main');
  m.className = 'v-' + v;
  document.body.classList.toggle('schmal', v === 'heute' || v === 'klein' || v === 'mehr' || v === 'rueck' || v === 'reihen');
  m.innerHTML = v === 'stand'   ? viewStand()
              : v === 'heute'   ? viewHeute()
              : v === 'klein'   ? viewKlein()
              : v === 'bereich' ? viewBereich()
              : v === 'reihen'  ? viewReihen()
              : v === 'rueck'   ? viewRueckblick()
              : viewMehr();
  hydrate(m);
  renderNavBadge();
  renderNavExtra();
}

/** Bereichsliste in der Seitenleiste — nur im breiten Layout sichtbar. */
function renderNavExtra(){
  const el = $('#nav-extra');
  if(!el) return;
  if(!document.body.classList.contains('wide')){ el.innerHTML = ''; return; }
  const bs = sortBereiche();
  el.innerHTML = `<div class="nav-sep"></div><div class="nav-bl">Bereiche</div>` +
    bs.map(b => {
      const offen = einsaetze().filter(i => i.bereich === b.id && !i.doneAt).length;
      const on = S.view === 'bereich' && S.offenerBereich === b.id;
      return `<button class="nav-ber ${on?'on':''}" data-bopen="${b.id}" title="${esc(b.name)}">
        <i style="background:${bFarbe(b.ci)}"></i><span>${esc(b.name)}</span><b>${offen}</b></button>`;
    }).join('') +
    `<button class="nav-ber" data-newb="1" style="color:var(--ink3)">
      <i style="background:transparent;border:1px dashed var(--line2)"></i><span>Bereich hinzufügen</span></button>`;
  hydrate(el);
}

function renderNavBadge(){
  const n = ueberfaelligerKram().length;
  const b = $('.nav-b[data-v="klein"]');
  if(!b) return;
  b.querySelector('.badge')?.remove();
  if(n){ const s = document.createElement('span'); s.className = 'badge'; b.appendChild(s); }
}

function bars(n){
  return `<span class="bars s${n}">${[1,2,3].map(i => `<i class="${i<=n?'f':''}"></i>`).join('')}</span>`;
}

/* ═══════════════════════════════════════════════════════════════════
   STAND · der Startbildschirm
   
   Beantwortet: Wo steht was? In fünf Sekunden, ohne Rekonstruktion.
   ═══════════════════════════════════════════════════════════════════ */
/** Grobe Kennzahl des Inhalts — ändert sie sich, gibt es Ungesichertes. */
function zustandsMarke(){
  return S.items.length + ':' + S.bereiche.length + ':' +
         S.items.reduce((a,i) => a + (i.doneAt?1:0) + (i.steps||[]).filter(x=>x.done).length, 0);
}

/**
 * Safari löscht den Speicher von Seiten, die sieben Tage nicht benutzt wurden.
 * Bei Arbeit in Schüben trifft das zu — deshalb ein sichtbarer, aber ruhiger
 * Hinweis statt einer Meldung, die man wegtippt und vergisst.
 */
/**
 * Das eigentliche Gegenmittel gegen den Vorfall: Weder ein neuer noch ein
 * zurückkehrender Nutzer kann heute erkennen, ob eine Instanz „seine" ist.
 * Diese Zeile beantwortet zwei Fragen auf einen Blick — seit wann gibt es
 * diese Instanz, und wurde sie je gesichert — ohne zu werten. Ein echter
 * Neustart liest sich neutral („seit heute"); eine Instanz, die eigentlich
 * Monate an Daten haben sollte, aber „seit heute" zeigt, fällt sofort auf.
 */
function instanzKennzeichenHTML(){
  const seit = S.settings.instanzSeit;
  if(!seit) return '';
  const tage = tageSeit(seit);
  const alter = tage === null ? 'seit heute' : tage === 0 ? 'seit heute'
    : tage === 1 ? 'seit gestern' : `seit ${tage} Tagen`;
  const ges = S.settings.letzteSicherung
    ? `zuletzt gesichert vor ${tageSeit(S.settings.letzteSicherung)} Tagen`
    : 'noch nie gesichert';
  return `<div class="instanz" data-goto="mehr">
    <span>Diese Instanz — ${alter} · ${ges}</span>
  </div>`;
}

function sicherungFaellig(){
  const letzte = S.settings.letzteSicherung;
  if(!letzte) return S.items.length >= 4 ? 'nie' : null;
  const t = tageSeit(letzte);
  const geaendert = S.settings.standBeiSicherung !== zustandsMarke();
  if(t >= 14 && geaendert) return 'lang';
  if(t >= 7 && geaendert)  return 'faellig';
  return null;
}

function sicherungHTML(){
  const stand = sicherungFaellig();
  if(!stand) return '';
  const t = S.settings.letzteSicherung ? tageSeit(S.settings.letzteSicherung) : null;
  const text = stand === 'nie'
    ? 'Du hast noch keine Sicherung angelegt. Safari kann den Speicher löschen, wenn du die App länger nicht öffnest — dann wäre alles weg.'
    : `Letzte Sicherung vor ${t} Tagen, seitdem hat sich etwas geändert. Safari kann den Speicher nach längerer Pause leeren.`;
  return `<div class="sichern ${stand==='lang'?'dring':''}">
    <div class="sichern-h">${svg(stand==='lang'?'alert':'arc')}<span>${stand==='lang'?'Sicherung überfällig':'Sicherung fällig'}</span></div>
    <p class="sichern-p">${text}</p>
    <div class="sichern-a">
      <button class="mini solid" data-export="1">${svg('arc')}Jetzt sichern</button>
      <button class="mini" data-sichernspaeter="1">Später</button>
    </div>
  </div>`;
}

/** Schmale Fortschrittszeile für Projektbereiche auf dem Stand. */
/**
 * Wandelt das Tagesprotokoll eines Bereichs in eine Geländesilhouette.
 * Kein Schmuck — eine zweite Kodierung derselben Zahl, die auch als
 * „vor X Tagen" und im Rückblick erscheint. Kein Bereich, keine
 * Bewegung: eine flache, gestrichelte Linie statt erfundener Kurven.
 */
function terrainPath(bid, tageN = 32){
  const werte = [];
  for(let i = tageN - 1; i >= 0; i--){
    const d = isoAdd(-i);
    werte.push((S.tage?.[d]?.[bid]) || 0);
  }
  const max = Math.max(1, ...werte);
  const W = 100, H = 74, basis = H - 4;
  const stufe = W / (tageN - 1);
  const pkt = werte.map((w, i) => {
    const h = w ? 8 + (w / max) * 46 : 0;
    return [Math.round(i * stufe * 10) / 10, Math.round((basis - h) * 10) / 10];
  });
  const flach = werte.every(w => w === 0);
  if(flach){
    return { flach: true, linie: `M0,${basis} L${W},${basis}` };
  }
  const linie = 'M' + pkt.map(([x,y]) => `${x},${y}`).join(' L');
  const flaeche = linie + ` L${W},${H} L0,${H} Z`;
  return { flach: false, linie, flaeche };
}

/**
 * Zeile für Bereiche mit Zielen. Nennt nur Zahlen, die belegt sind —
 * kein „0/0", kein Planurteil ohne Zeitraum.
 */
function zielZeileHTML(b){
  const zs = ziele(b.id);
  const laufend = zs.filter(z => z.zustand === 'laeuft').length;
  const fertig = zs.filter(z => z.zustand === 'fertig').length;
  const teile = [];
  if(laufend) teile.push(`<b>${laufend}</b> ${laufend===1?'Ziel läuft':'Ziele laufen'}`);
  if(fertig) teile.push(`${fertig} erreicht`);
  if(!teile.length) return '';
  return `<div class="bziel" data-bopen="${b.id}" data-sp="ziele">${teile.join(' · ')}</div>`;
}

function projektZeileHTML(b){
  const f = projektFortschritt(b.id);
  const l = planLage(b);
  const sp = projektSpanne(b);
  return `<div class="bproj">
    <span>${f.etappen}/${f.gesamt} Etappen</span>
    <span class="bproj-bar"><i style="width:${Math.round(f.anteil*100)}%"></i></span>
    ${l && sp && !sp.offen
      ? `<span class="bproj-lage ${l.lage}">${l.lage==='hinter'?'hinterher':l.lage==='vor'?'voraus':'im Plan'}</span>`
      : `<span class="bproj-lage">${Math.round(f.anteil*100)} %</span>`}
  </div>`;
}

function viewStand(){
  const bs = sortBereiche();
  if(!bs.length){
    return `<div class="void-s">
      <div class="void-r"></div>
      <div class="void-h">Noch keine Bereiche</div>
      <p class="void-p">Ein Bereich ist ein Lebensbereich mit eigenem Tempo — ein Startup, das Lernen, das Private. Vier bis fünf sind genug.</p>
      <button class="big" data-newb="1">${svg('plus')}Ersten Bereich anlegen</button>
    </div>`;
  }

  const kennz = instanzKennzeichenHTML();
  const welcome = zeigeWiedereinstieg() ? wiedereinstiegHTML() : '';
  const sicher  = S.settings.sichernSpaeter === todayISO() ? '' : sicherungHTML();

  const karten = bs.map((b, idx) => {
    const a = aktiverEinsatz(b.id);
    const seit = bereichBeruehrt(b.id);
    const liegt = istLiegend(b.id);
    const fertig = erledigte(b.id).length;
    const warte = wartende(b.id).length;
    const nx = a ? naechsterSchritt(a) : null;
    const tot = a ? (a.steps||[]).length : 0;
    const done = a ? schritteFertig(a) : 0;
    const pct = tot ? Math.round(done/tot*100) : 0;

    const terr = terrainPath(b.id);

    return `<section class="bpanel ${liegt?'stale':''} ${a?'':'empty-b'}"
              style="--bc:${bFarbe(b.ci)};animation-delay:${idx*55}ms" data-b="${b.id}">
      <svg class="bterrain" viewBox="0 0 100 74" preserveAspectRatio="none">
        ${terr.flach
          ? `<path d="${terr.linie}" fill="none" stroke="${bFarbe(b.ci)}" stroke-width="1" opacity=".4" stroke-dasharray="1.2 3" vector-effect="non-scaling-stroke"/>`
          : `<path d="${terr.flaeche}" fill="${bFarbe(b.ci)}" opacity=".14"/>
             <path d="${terr.linie}" fill="none" stroke="${bFarbe(b.ci)}" stroke-width="1" opacity=".85" vector-effect="non-scaling-stroke"/>`}
      </svg>

      <div class="bhead" data-bopen="${b.id}">
        <span class="bname">${esc(b.name)}</span>
        <span class="bwhen ${liegt?'stale':''}">${seitText(seit)}</span>
        <span class="bchev">${svg('right')}</span>
      </div>

      ${hatZiele(b.id) ? zielZeileHTML(b) : istProjekt(b) ? projektZeileHTML(b) : ''}
      ${a ? `
        <div class="bkey">${
          a.ziel && ziel(b.id, a.ziel) ? esc(ziel(b.id, a.ziel).titel)
          : istProjekt(b) ? 'Laufende Etappe' : 'Aktuell'}</div>
        <div class="bmain" data-open="${a.id}">${esc(a.title)}</div>
        ${tot ? `<div class="bprog"><i style="width:${pct}%"></i></div>` : ''}
        ${nx ? `<div class="bnext">${svg('turn')}<span>${esc(nx.text)}</span></div>` : ''}
      ` : `
        <div class="bkey">Aktuell</div>
        <div class="bmain none">Nichts festgelegt${warte?` — ${warte} ${warte===1?'Vorhaben wartet':'Vorhaben warten'}`:''}</div>
      `}

      <div class="bfoot">
        <span class="bstat" data-bopen="${b.id}" data-sp="fertig"><b>${fertig}</b> fertig geworden</span>
        ${warte && a ? `<span class="bstat"><b>${warte}</b> in Reserve</span>` : ''}
        <span class="bact">
          ${a
            ? `<button class="mini solid" data-focus="${a.id}">${svg('play')}Fokus</button>
               <button class="mini" data-switch="${b.id}">${svg('swap')}</button>`
            : `<button class="mini solid" data-newe="${b.id}">${svg('plus')}Einsatz setzen</button>
               ${warte ? `<button class="mini" data-switch="${b.id}">${svg('swap')}</button>` : ''}`}
        </span>
      </div>
    </section>`;
  }).join('');

  const kram = offenerKram().length;
  const laufendeReihen = reihen().filter(reiheLaeuft).length;
  const zeilen = [];
  if(kram) zeilen.push(`${kram} ${kram===1?'Kleinigkeit liegt':'Kleinigkeiten liegen'} daneben — <button data-goto="klein" style="color:var(--glow)">ansehen</button>`);
  if(laufendeReihen) zeilen.push(`${laufendeReihen} ${laufendeReihen===1?'Reihe läuft':'Reihen laufen'} — <button data-goto="reihen" style="color:var(--glow)">ansehen</button>`);
  const fuss = zeilen.length
    ? `<p class="grp-f" style="text-align:center;margin-top:28px;padding-bottom:8px">${zeilen.join('<br>')}</p>`
    : '';

  return kennz + welcome + sicher + `<div class="stand">${karten}</div>` + fuss;
}

/* ── Wiedereinstieg ─────────────────────────────────────────────── */
/** Ein Satz aus der Vergangenheit — nur wenn er belegt ist. */
function wiedereinstiegSatz(){
  const st = laengstStill();
  if(!st || st.t < 14) return '';
  return `<p class="welcome-satz">${esc(st.b.name)} liegt am längsten still — ${st.t} Tage.${
    st.muster ? ' Das war im Zeitraum davor auch so.' : ''}</p>`;
}

function wiedereinstiegHTML(){
  const p = pauseTage();
  const bs = sortBereiche();
  const zeilen = bs.map(b => {
    const a = aktiverEinsatz(b.id);
    const t = tageSeit(bereichBeruehrt(b.id));
    return `<div class="welcome-i">
      <i style="background:${bFarbe(b.ci)}"></i>
      <span><b>${esc(b.name)}</b> — ${a ? esc(a.title) : 'nichts festgelegt'}
      <span style="color:var(--ink3)">· ${seitText(bereichBeruehrt(b.id))}</span></span>
    </div>`;
  }).join('');

  const kram = ueberfaelligerKram().length;

  return `<div class="welcome">
    <div class="welcome-mark">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="welcome-k">Willkommen zurück</div>
    <div class="welcome-h">${p} Tage sind vergangen.</div>
    <p class="welcome-p">Nichts ist verloren gegangen. Hier steht, wo alles liegt — such nichts zusammen, lies einfach.</p>
    <div class="welcome-l">${zeilen}</div>
    ${kram ? `<p class="welcome-p" style="margin-bottom:16px">${kram} ${kram===1?'Kleinigkeit ist':'Kleinigkeiten sind'} in der Zwischenzeit überfällig geworden.</p>` : ''}
    ${wiedereinstiegSatz()}
    <button class="mini" data-dismiss="1">${svg('check')}Verstanden</button>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   BEREICHSSEITE
   
   Drei Zustände nebeneinander — der Kanban-Gedanke, aber auf das
   reduziert, was auf ein Telefon passt und zur Ein-Einsatz-Regel passt.
   ═══════════════════════════════════════════════════════════════════ */
function viewBereich(){
  const b = bereich(S.offenerBereich);
  if(!b){ S.view = 'stand'; return viewStand(); }
  const sp = S.bereichSpalte || (hatZiele(S.offenerBereich) ? 'ziele' : 'aktuell');

  const a = aktiverEinsatz(b.id);
  const res = wartende(b.id);
  const fer = erledigte(b.id).sort((x,y) => (y.doneAt||'').localeCompare(x.doneAt||''));

  const kopf = `<div class="bpage-h" style="--bc:${bFarbe(b.ci)}">
    <input class="bpage-n" data-bname="${b.id}" value="${esc(b.name)}" maxlength="60"
           style="font-size:${b.name.length > 34 ? 19 : b.name.length > 24 ? 22 : 26}px"
           aria-label="Bereich umbenennen">
    <div class="bpage-m">${seitText(bereichBeruehrt(b.id))} zuletzt bewegt
      <span class="sep"></span>${fer.length} fertig geworden
      <button class="bpage-p" data-${istProjekt(b)?'projektbearb':'projektan'}="${b.id}">
        ${svg('cal')}${istProjekt(b) ? 'Projekt' : 'Projekt daraus machen'}</button>
    </div>
  </div>`;

  const proj = istProjekt(b);
  const zAnz = ziele(b.id).length;
  // Ziele stehen vorn — auch ohne Inhalt. Ein Zugang, den man erst
  // seitwärts schieben muss, wird nicht gefunden.
  const reiter = [
    ['ziele','Ziele', zAnz || ''],
    ...(proj && zieleMitZeit(b.id).length ? [['zeit','Zeitachse','']] : []),
    ['aktuell', zAnz ? 'Läuft' : 'Aktuell', a?1:0],
    ['reserve', proj ? 'Kommend' : 'Reserve', res.length],
    ['fertig','Erledigt',fer.length],
  ];
  const tabs = `<div class="ktabs">
    ${reiter.map(([k,l,n]) => `<button class="ktab ${sp===k?'on':''}" data-sp="${k}">
        ${l}${n!=='' ? `<span class="kn">${n}</span>` : ''}</button>`).join('')}
  </div>`;

  const breit = document.body.classList.contains('wide');

  if(sp === 'ziele'){
    return kopf + tabs + zieleHTML(b);
  }

  // Schmal: Zeitachse als eigener Reiter. Breit: sie steht über den
  // Spalten — dort ist Platz für Übersicht und Arbeit zugleich.
  if(proj && sp === 'zeit' && !breit){
    return kopf + tabs + zeitachse(b);
  }

  // Breites Layout: alle drei Zustände nebeneinander — das klassische Board.
  if(breit){
    const spalte = (titel, n, inhalt) => `<div class="kcol">
      <div class="kcol-h"><span>${titel}</span><span class="n">${n}</span></div>${inhalt}</div>`;

    const leer = t => `<p class="grp-f" style="padding:18px 2px">${t}</p>`;

    const cAktuell = a ? kanbanKarte(a,'aktuell')
      : leer(res.length
          ? `Kein Einsatz gesetzt. ${res.length} ${res.length===1?'Vorhaben wartet':'Vorhaben warten'} nebenan.`
          : 'Kein Einsatz gesetzt.')
        + `<button class="mini solid" data-newe="${b.id}">${svg('plus')}Einsatz anlegen</button>`;

    const cReserve = res.length ? res.map(x => kanbanKarte(x,'reserve')).join('')
      : leer('Nichts in Reserve.') + `<button class="mini" data-newe="${b.id}">${svg('plus')}Vorhaben anlegen</button>`;

    const cFertig = fer.length ? fer.map(x => kanbanKarte(x,'fertig')).join('')
      : leer('Noch nichts abgeschlossen.');

    return kopf + zieleHTML(b) + (proj && zAnz === 0 ? zeitachse(b) : '') + `<div class="kcols">
      ${spalte(proj ? 'Läuft' : 'Aktuell', a?1:0, cAktuell)}
      ${spalte(proj ? 'Kommend' : 'Reserve', res.length, cReserve)}
      ${spalte(proj ? 'Abgeschlossen' : 'Erledigt', fer.length, cFertig)}
    </div>`;
  }

  let body = '';
  if(sp === 'aktuell'){
    body = a ? `<div class="strand">${kanbanKarte(a,'aktuell')}</div>
      <p class="grp-f">In jedem Bereich läuft genau ein Einsatz. Die Reserve wartet, bis dieser abgeschlossen ist — oder du wechselst bewusst.</p>`
    : `<div class="void-s">
        <div class="void-r"></div>
        <div class="void-h">Kein Einsatz gesetzt</div>
        <p class="void-p">${res.length
          ? `${res.length} ${res.length===1?'Vorhaben wartet':'Vorhaben warten'} in der Reserve.`
          : 'Leg fest, was in diesem Bereich als Nächstes zählt.'}</p>
        ${!zAnz ? `<p class="void-p" style="margin-top:-14px;font-size:13.5px">
          Bei größeren Vorhaben lohnt sich vorher die Gliederung in
          <button data-sp="ziele" style="color:var(--glow)">Ziele</button>.</p>` : ''}
        ${res.length ? `<button class="ghost" data-sp="reserve">${svg('list')}Reserve ansehen</button>` : ''}
        <button class="big" data-newe="${b.id}" style="margin-top:10px">${svg('plus')}Einsatz anlegen</button>
      </div>`;
  }
  else if(sp === 'reserve'){
    body = res.length
      ? `<div class="strand">${res.map(x => kanbanKarte(x,'reserve')).join('')}</div>`
      : `<div class="void-s"><div class="void-r"></div>
          <div class="void-h">Reserve leer</div>
          <p class="void-p">Vorhaben, die du hier ablegst, warten sichtbar — ohne dich abzulenken.</p>
          <button class="big" data-newe="${b.id}">${svg('plus')}Vorhaben anlegen</button></div>`;
  }
  else {
    body = fer.length
      ? `<div class="strand">${fer.map(x => kanbanKarte(x,'fertig')).join('')}</div>
         <p class="grp-f">Das ist der Rückstand deiner Arbeit in diesem Bereich — was tatsächlich zu einem Ergebnis geführt hat.</p>`
      : `<div class="void-s"><div class="void-r"></div>
          <div class="void-h">Noch nichts abgeschlossen</div>
          <p class="void-p">Hier sammelt sich, was fertig geworden ist. Auch nach Monaten noch nachlesbar.</p></div>`;
  }

  return kopf + tabs + body;
}

/* ═══════════════════════════════════════════════════════════════════
   ZIELE · Darstellung auf der Bereichsseite
   ═══════════════════════════════════════════════════════════════════ */
const Z_ZUSTAND = { laeuft:'Läuft', ruht:'Ruht', fertig:'Abgeschlossen' };

function zieleHTML(b){
  const zs = ziele(b.id);
  if(!zs.length){
    return `<div class="zleer">
      <div class="zleer-h">Noch keine Ziele</div>
      <p>Ein Bereich kann mehrere Ziele nebeneinander verfolgen — jedes mit
         eigenen Meilensteinen und eigenen Einsätzen. Trotzdem läuft immer nur
         <b>ein</b> Einsatz im Bereich.</p>
      <p class="zleer-bsp">Bei einem Vorhaben wie <em>Margo</em> wären das etwa
         „Fördermittel einholen", „Kolonien kastrieren", „Ehrenamtliche gewinnen".</p>
      <p class="zleer-k">Ein Titel genügt. Alles Weitere ist nachtragbar.</p>
      <button class="big" data-zneu="${b.id}">${svg('plus')}Erstes Ziel anlegen</button>
    </div>`;
  }

  const laufend = zs.filter(z => z.zustand === 'laeuft');
  const ruhend  = zs.filter(z => z.zustand === 'ruht');
  const fertig  = zs.filter(z => z.zustand === 'fertig');

  const karte = z => {
    const f = zielFortschritt(b.id, z.id);
    const aktiv = zielEinsaetze(b.id, z.id).find(e => e.aktiv && !e.doneAt);
    const naechst = zielEinsaetze(b.id, z.id).find(e => !e.doneAt && !e.aktiv);
    const ms = (z.meilensteine||[]).slice().sort((a,c)=>(a.datum||'').localeCompare(c.datum||''));
    const hatZeit = zielHatZeitraum(z);

    return `<div class="zk ${z.zustand}" data-z="${z.id}">
      <div class="zk-h">
        <div class="zk-t" data-zbearb="${b.id}:${z.id}">${esc(z.titel)}</div>
        <span class="zk-z">${Z_ZUSTAND[z.zustand]}</span>
      </div>
      ${z.ergebnis ? `<div class="zk-e">Fertig, wenn ich ${esc(z.ergebnis)}${/[.!?]$/.test(z.ergebnis)?'':'.'}</div>` : ''}
      ${hatZeit ? `<div class="zk-zeit">${zielZeitText(z)}
        ${(() => { const l = zielPlanLage(b,z); return l ? `<span class="zk-lage ${l.lage}">${
          l.lage==='plan'?'im Plan':l.lage==='vor'?'voraus':'hinterher'}</span>` : ''; })()}
      </div>` : ''}

      ${(() => {
        const et = etappen(b.id, z.id).sort((x,y) =>
          (x.von||x.bis||'9999').localeCompare(y.von||y.bis||'9999'));
        // Ein Ziel MIT Zeitraum zeigt seine Etappen geordnet — das ist
        // Szene „erste Woche im neuen Job": nicht der eine Einsatz,
        // sondern der Ablauf, in dem er steht.
        if(et.length){
          return `<div class="zk-et">${et.map((e,i) => {
            const zustand = e.doneAt ? 'fertig' : e.aktiv ? 'laeuft' : 'offen';
            return `<div class="zk-er ${zustand}" data-open="${e.id}">
              <span class="zk-ern">${i+1}</span>
              <div class="zk-erb">
                <div class="zk-ert">${esc(e.title)}</div>
                <div class="zk-erm">${zeitraumText(e) || 'ohne Zeitraum'}</div>
              </div>
              ${e.doneAt ? svg('check') : ''}
            </div>`;
          }).join('')}</div>`;
        }
        return aktiv ? `<div class="zk-lauf" data-open="${aktiv.id}">
            <span class="zk-pt"></span><span>${esc(aktiv.title)}</span>
          </div>`
        : naechst ? `<div class="zk-lauf stumm" data-pick="${naechst.id}">
            <span class="zk-pt off"></span><span>${esc(naechst.title)} — starten</span>
          </div>`
        : '';
      })()}

      ${ms.length ? `<div class="zk-ms">
        ${ms.map(m => `<button class="zk-m ${m.erreicht?'erreicht':''}" data-zms="${b.id}:${z.id}:${m.id}">
          <span class="zk-mp">${m.erreicht ? svg('check') : ''}</span>
          <span class="zk-mt">${esc(m.text)}</span>
          ${m.datum ? `<span class="zk-md">${dfmtLang(m.datum)}</span>` : ''}
        </button>`).join('')}
      </div>` : ''}

      <div class="zk-f">
        <span>${f.offen} offen${f.fertig ? ` · ${f.fertig} fertig` : ''}${
          f.meilensteine ? ` · ${f.msFertig}/${f.meilensteine} Meilensteine` : ''}</span>
        <span class="zk-a">
          <button class="mini" data-zeinsatz="${b.id}:${z.id}">${svg('plus')}Einsatz</button>
          <button class="mini" data-zmsneu="${b.id}:${z.id}">${svg('flag')}Meilenstein</button>
        </span>
      </div>
    </div>`;
  };

  return `<div class="zliste">
    ${laufend.map(karte).join('')}
    ${ruhend.length ? `<div class="zgrp">Ruht</div>${ruhend.map(karte).join('')}` : ''}
    ${fertig.length ? `<div class="zgrp">Abgeschlossen · ${fertig.length}</div>${fertig.map(karte).join('')}` : ''}
    <button class="mini zneu" data-zneu="${b.id}">${svg('plus')}Ziel anlegen</button>
  </div>`;
}

function zielZeitText(z){
  if(z.von && z.bis) return `${dfmtLang(z.von)} → ${dfmtLang(z.bis)} · ${tageBis(z.bis)}`;
  if(z.bis) return `bis ${dfmtLang(z.bis)} · ${tageBis(z.bis)}`;
  if(z.von) return `seit ${dfmtLang(z.von)}`;
  return '';
}

/* ═══════════════════════════════════════════════════════════════════
   ZEITACHSE
   
   Zur Orientierung, nicht zum Arbeiten. Beantwortet „wo stehe ich",
   nicht „was mache ich jetzt". Gearbeitet wird weiter über Heute und
   den einen laufenden Einsatz.
   ═══════════════════════════════════════════════════════════════════ */
function zeitachse(b){
  const sp = projektSpanne(b);
  if(!sp) return '';
  const et = etappen(b.id);
  const ms = [...(b.meilensteine||[])].sort((x,y) => (x.datum||'').localeCompare(y.datum||''));
  const t0 = new Date(sp.von+'T00:00').getTime();
  const t1 = new Date(sp.bis+'T00:00').getTime();
  const spanne = Math.max(1, t1 - t0);
  const pos = d => d ? clamp(((new Date(d+'T00:00').getTime() - t0) / spanne) * 100, 0, 100) : null;
  const heute = pos(todayISO());
  const imBild = new Date(todayISO()+'T00:00').getTime() >= t0 &&
                 new Date(todayISO()+'T00:00').getTime() <= t1;
  const lage = planLage(b);
  const f = projektFortschritt(b.id);

  // Etappen als beschriftete Zeilen unter der Achse — auf dem Telefon
  // sind Balken von 3 % Breite nicht treffbar und nicht lesbar.
  const balken = et.map((e, i) => {
    const a = pos(e.von), z = pos(e.bis);
    if(a === null && z === null) return '';
    const links = a ?? Math.max(0, (z ?? 0) - 4);
    const breite = Math.max(2.5, (z ?? links + 4) - links);
    const zustand = e.doneAt ? 'fertig' : e.aktiv ? 'laeuft' : 'offen';
    return `<div class="za-et ${zustand}" style="left:${links}%;width:${breite}%;--i:${i}"></div>`;
  }).join('');

  const marken = ms.map(m => {
    const p = pos(m.datum);
    if(p === null) return '';
    return `<div class="za-ms ${m.erreicht?'erreicht':''}" style="left:${p}%"
              data-ms="${m.id}" title="${esc(m.text)} · ${dfmtLang(m.datum)}"></div>`;
  }).join('');

  // Etappenliste — der eigentliche Bedienweg
  const liste = et.map((e, i) => {
    const zustand = e.doneAt ? 'fertig' : e.aktiv ? 'laeuft' : 'offen';
    const tot = (e.steps||[]).length, fer = schritteFertig(e);
    const nx = naechsterSchritt(e);
    const laeuftJetzt = e.von && e.bis &&
      todayISO() >= e.von && todayISO() <= e.bis;
    return `<div class="za-r ${zustand} ${laeuftJetzt?'jetzt':''}" data-open="${e.id}">
      <span class="za-rn">${i+1}</span>
      <div class="za-rb">
        <div class="za-rt">${esc(e.title)}</div>
        <div class="za-rm">
          ${zeitraumText(e) || 'ohne Zeitraum'}
          ${tot ? `<span class="sep"></span>${fer}/${tot} Schritte` : ''}
          ${e.doneAt ? '<span class="sep"></span>abgeschlossen'
            : laeuftJetzt && !e.aktiv ? '<span class="sep"></span><b>läuft eigentlich jetzt</b>' : ''}
        </div>
        ${nx && e.aktiv ? `<div class="za-rn2">${svg('turn')}<span>${esc(nx.text)}</span></div>` : ''}
      </div>
      ${!e.doneAt && !e.aktiv ? `<button class="za-rs" data-pick="${e.id}"
        aria-label="Zu dieser Etappe wechseln">${svg('play')}</button>` : ''}
      ${e.doneAt ? `<span class="za-rc">${svg('check')}</span>` : ''}
    </div>`;
  }).join('');

  const laufend = et.find(e => e.aktiv && !e.doneAt);
  const naechste = et.find(e => !e.doneAt && !e.aktiv);

  return `<div class="za" style="--bc:${bFarbe(b.ci)}">
    <div class="za-kopf">
      <div>
        <div class="za-ziel">${esc(b.projekt.ziel || 'Ohne Ziel')}</div>
        <div class="za-spanne">${dfmtLang(sp.von)} → ${sp.offen ? 'offen' : dfmtLang(sp.bis)}
          ${!sp.offen ? `<span class="sep"></span>${tageBis(sp.bis)}` : ''}</div>
      </div>
      ${lage && !sp.offen ? `<div class="za-lage ${lage.lage}">
        ${lage.lage==='plan' ? 'im Plan' : lage.lage==='vor' ? 'vor dem Plan' : 'hinter dem Plan'}
      </div>` : ''}
    </div>

    <div class="za-bahn">
      <div class="za-grund"></div>
      ${balken}
      ${marken}
      ${imBild ? `<div class="za-heute" style="left:${heute}%"><i></i><span>heute</span></div>` : ''}
    </div>

    <div class="za-fuss">
      <span><b>${f.etappen}</b>/${f.gesamt} Etappen</span>
      ${f.schritteGesamt ? `<span class="sep"></span><span><b>${f.schritte}</b>/${f.schritteGesamt} Schritte</span>` : ''}
      <span class="sep"></span><span>${Math.round(f.anteil*100)} %</span>
    </div>

    ${et.length ? `<div class="za-liste">${liste}</div>` : `
      <div class="za-leer">Noch keine Etappen. Gliedere das Projekt in aufeinanderfolgende Abschnitte.</div>`}

    ${ms.length ? `<div class="za-msliste">
      <div class="za-msh">Meilensteine</div>
      ${ms.map(m => `<div class="za-msi ${m.erreicht?'erreicht':''}" data-ms="${m.id}">
        <span class="za-msp">${m.erreicht ? svg('check') : ''}</span>
        <span class="za-mst">${esc(m.text)}</span>
        <span class="za-msd">${m.datum ? dfmtLang(m.datum) : ''}</span>
      </div>`).join('')}
    </div>` : ''}

    <div class="za-akt">
      <button class="mini" data-neueetappe="${b.id}">${svg('plus')}Etappe</button>
      <button class="mini" data-neuerms="${b.id}">${svg('flag')}Meilenstein</button>
      <button class="mini" data-projektbearb="${b.id}">${svg('pencil')}Projekt</button>
    </div>
  </div>`;
}

function dfmtLang(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const MO = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return `${+d}. ${MO[+m-1]} ${y.slice(2)}`;
}
function tageBis(iso){
  const d = dayDiff(iso);
  if(d === null) return '';
  if(d < 0) return `${-d} Tage überfällig`;
  if(d === 0) return 'endet heute';
  if(d === 1) return 'noch ein Tag';
  if(d < 60) return `noch ${d} Tage`;
  return `noch ${Math.round(d/30)} Monate`;
}
function zeitraumText(e){
  if(e.von && e.bis) return `${dfmtLang(e.von)} → ${dfmtLang(e.bis)}`;
  if(e.bis) return `bis ${dfmtLang(e.bis)}`;
  if(e.von) return `ab ${dfmtLang(e.von)}`;
  return '';
}

/** Karte auf der Bereichsseite — mit den Zustandswechseln als Knöpfe. */
function kanbanKarte(it, sp){
  const nx = naechsterSchritt(it);
  const tot = (it.steps||[]).length;
  const done = schritteFertig(it);
  const pct = tot ? Math.round(done/tot*100) : 0;
  const cyc = (it.startedAt && it.doneAt)
    ? Math.max(0, Math.round((new Date(it.doneAt) - new Date(it.startedAt))/864e5)) : null;

  const akt =
    sp === 'aktuell' ? `<button class="mini solid" data-focus="${it.id}">${svg('play')}Fokus</button>
                        <button class="mini" data-done="${it.id}">${svg('check')}Erledigt</button>
                        <button class="mini" data-toreserve="${it.id}">${svg('swap')}In Reserve</button>`
  : sp === 'reserve' ? `<button class="mini solid" data-pick="${it.id}">${svg('right')}Zum Einsatz</button>
                        <button class="mini" data-done="${it.id}">${svg('check')}Erledigt</button>`
  :                    `<button class="mini" data-reopen="${it.id}">${svg('undo')}Wieder öffnen</button>`;

  return `<div class="kcard ${sp==='fertig'?'is-done':''}">
    <div class="kc-t" data-open="${it.id}">${esc(it.title)}</div>
    ${it.proof ? `<div class="kc-p">Fertig, wenn ich ${esc(it.proof)}${/[.!?]$/.test(it.proof)?'':'.'}</div>` : ''}
    ${tot && sp !== 'fertig' ? `<div class="bprog" style="--bc:var(--ink3);margin:14px 0 12px"><i style="width:${pct}%"></i></div>` : ''}
    ${nx && sp !== 'fertig' ? `<div class="bnext">${svg('turn')}<span>${esc(nx.text)}</span></div>` : ''}
    <div class="kc-m">
      ${sp === 'fertig'
        ? `${it.doneAt ? new Date(it.doneAt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}) : ''}
           ${cyc !== null ? `<span class="sep"></span>${cyc} ${cyc===1?'Tag':'Tage'} Durchlauf` : ''}
           ${it.trk ? `<span class="sep"></span>${Math.round(it.trk/60)} min erfasst` : ''}`
        : `${tot ? `${done}/${tot} Schritte<span class="sep"></span>` : ''}${bars(strengthOf(it))}
           <span class="sep"></span>${seitText(it.beruehrt)}`}
    </div>
    <div class="kc-a">${akt}</div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   HEUTE · der Ausschnitt
   ═══════════════════════════════════════════════════════════════════ */
/**
 * Bei einer Projektetappe zeigt Heute alle offenen Schritte, nicht nur den
 * nächsten — das ist die tagesgenaue Ebene für durchgeplante Zeiträume.
 * Bei gewöhnlichen Einsätzen bleibt es beim nächsten Schritt.
 */
function etappenSchritteHTML(it){
  if(!it) return '';
  const b = it.bereich ? bereich(it.bereich) : null;
  const offen = (it.steps||[]).filter(s => !s.done);
  if(!offen.length) return '';

  if(!istProjekt(b) || offen.length === 1){
    return `<div class="hero-b">${svg('turn')}<span>${esc(offen[0].text)}</span></div>`;
  }
  return `<div class="hero-liste">
    ${offen.slice(0,5).map(s => `<div class="hero-s" data-step="${it.id}:${s.id}">
      <span class="orb"></span><span>${esc(s.text)}</span></div>`).join('')}
    ${offen.length > 5 ? `<div class="hero-mehr">+${offen.length-5} weitere in dieser Etappe</div>` : ''}
  </div>`;
}

function viewHeute(){
  const gewaehlt = einsaetze().filter(i => i.aktiv && !i.doneAt && istHeute(i));
  const alleAktiven = einsaetze().filter(i => i.aktiv && !i.doneAt);
  const haupt = gewaehlt[0] || alleAktiven[0] || null;
  const kram = heuteKram();

  if(!haupt && !kram.length){
    return `<div class="void-s">
      <div class="void-r"></div>
      <div class="void-h">Nichts vorgemerkt</div>
      <p class="void-p">Wähle unter „Stand" einen Einsatz für heute — oder trag eine Kleinigkeit ein.</p>
      <button class="ghost" data-goto="stand">${svg('compass')}Zum Stand</button>
    </div>`;
  }

  let block = '';
  if(haupt){
    const b = bereich(haupt.bereich);
    const nx = naechsterSchritt(haupt);
    block = `<div class="hero">
      <div class="hero-k" style="color:${b?bFarbe(b.ci):'var(--ink3)'}">${b?esc(b.name):''}</div>
      <div class="hero-t">${esc(haupt.title)}</div>
      ${haupt.proof ? `<p class="hero-p">Fertig, wenn ich <em>${esc(haupt.proof)}</em>${/[.!?]$/.test(haupt.proof)?'':'.'}</p>` : ''}
      ${etappenSchritteHTML(haupt)}
    </div>
    <div class="acts">
      <button class="big" data-focus="${haupt.id}">${svg('play')}Fokus starten</button>
      <button class="ghost" data-done="${haupt.id}">${svg('check')}Erledigt</button>
    </div>`;
  }

  const grenze = S.settings.tagesgrenze || 3;
  const geplant = (haupt ? 1 : 0) + alleAktiven.filter(i => i.id !== haupt?.id).length + kram.length;
  const grenzHTML = geplant > grenze ? `<div class="grenze">
    ${svg('alert')}<span><b>${geplant} Dinge</b> stehen heute an, dein Maß ist ${grenze}.
    Vielleicht muss nicht alles heute sein.</span>
    <span class="grenze-c">
      <button data-tg="-1" aria-label="Weniger">${svg('minus')}</button>
      <b>${grenze}</b>
      <button data-tg="1" aria-label="Mehr">${svg('plus')}</button>
    </span>
  </div>` : '';

  const weitere = alleAktiven.filter(i => i.id !== haupt?.id);
  const restEinsaetze = weitere.length ? `<div class="strand">
    <div class="shead"><span>Weitere Einsätze</span><span class="n">${weitere.length}</span></div>
    ${weitere.map(zeile).join('')}
  </div>` : '';

  const kramBlock = kram.length ? `<div class="strand">
    <div class="shead"><span>Kleinkram heute</span><span class="n">${kram.length}</span></div>
    ${kram.map(zeile).join('')}
  </div>` : '';

  const reihenHeute = reihen().filter(reiheHeuteFaellig);
  const reihenBlock = reihenHeute.length ? `<div class="strand">
    <div class="shead"><span>Reihen heute</span><span class="n">${reihenHeute.length}</span></div>
    ${reihenHeute.map(reiheHeuteZeile).join('')}
  </div>` : '';

  return block + grenzHTML + restEinsaetze + reihenBlock + kramBlock;
}

/* ── Zeile ──────────────────────────────────────────────────────── */
function zeile(it){
  const b = it.bereich ? bereich(it.bereich) : null;
  const nx = naechsterSchritt(it);
  const tot = (it.steps||[]).length;
  const ueber = isOver(it.due) && !it.doneAt;
  const meta = [];
  if(b) meta.push(esc(b.name));
  if(it.due) meta.push(`<span class="${ueber?'urgent':''}">${dueLabel(it.due)}</span>`);
  if(tot) meta.push(`${schritteFertig(it)}/${tot}`);
  if(it.kind === 'einsatz') meta.push(bars(strengthOf(it)));

  return `<div class="item ${it.doneAt?'done':''}" data-open="${it.id}">
    <button class="orb ${it.doneAt?'on':''} ${ueber?'urge':''}" data-done="${it.id}" aria-label="Erledigt">${svg('check')}</button>
    <div class="ib">
      <div class="it">${esc(it.title)}</div>
      ${meta.length ? `<div class="im">${meta.join('<span class="sep"></span>')}</div>` : ''}
      ${nx && it.aktiv ? `<div class="im" style="margin-top:6px">${svg('turn')}<span>${esc(nx.text)}</span></div>` : ''}
    </div>
    <button class="ir ${istHeute(it)?'on':''}" data-heute="${it.id}" aria-label="Für heute">
      ${istHeute(it) ? svgF('star') : svg('star')}</button>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   KLEINKRAM · flach, schnell, ohne Formulierungsprüfung
   ═══════════════════════════════════════════════════════════════════ */
function viewKlein(){
  const f = S.settings.kleinFilter || 'offen';
  const alle = kleinkram();
  const offen = alle.filter(i => !i.doneAt);
  const ueber = offen.filter(i => isOver(i.due));
  const fertig = alle.filter(i => i.doneAt)
    .sort((a,b) => (b.doneAt||'').localeCompare(a.doneAt||''));

  const liste = f === 'ueber' ? ueber : f === 'fertig' ? fertig.slice(0,50) : offen;
  const sortiert = f === 'fertig' ? liste
    : [...liste].sort((a,b) => (dayDiff(a.due) ?? 9999) - (dayDiff(b.due) ?? 9999));

  const quick = `<div class="quick">
    ${svg('plus')}
    <input id="q-in" placeholder="Kleinigkeit eintragen …" enterkeyhint="done" autocomplete="off">
    <button id="q-ok" disabled aria-label="Hinzufügen">${svg('check')}</button>
  </div>`;

  const chips = `<div class="chipbar">
    <button class="chip ${f==='offen'?'on':''}" data-kf="offen">Offen ${offen.length}</button>
    <button class="chip ${f==='ueber'?'on':''}" data-kf="ueber">Überfällig ${ueber.length}</button>
    <button class="chip ${f==='fertig'?'on':''}" data-kf="fertig">Erledigt ${fertig.length}</button>
  </div>`;

  const body = sortiert.length
    ? `<div class="strand">${sortiert.map(zeile).join('')}</div>`
    : `<div class="void-s">
        <div class="void-r"></div>
        <div class="void-h">${f==='ueber'?'Nichts überfällig':f==='fertig'?'Noch nichts erledigt':'Nichts offen'}</div>
        <p class="void-p">${f==='offen'
          ? 'Alles, was zwischendurch anfällt, kommt hier hinein — ohne Nachweis, ohne Bereich, ohne Zeremonie.'
          : 'Hier ist gerade nichts.'}</p>
      </div>`;

  const hinweis = f === 'offen' && offen.length > 12
    ? `<p class="grp-f" style="text-align:center">${offen.length} offene Kleinigkeiten. Was hier länger als einen Monat liegt, wird meist nie erledigt — löschen ist auch eine Entscheidung.</p>`
    : '';

  return quick + chips + body + hinweis;
}

/* ═══════════════════════════════════════════════════════════════════
   RÜCKBLICK
   
   Sätze, keine Kennzahlen. Jede Aussage muss ein Mensch weitererzählen
   können. Findet sich für eine Erkenntnis kein solcher Satz, entfällt sie.
   Bei dünnen Daten sagt die Ansicht, dass es zu früh ist.
   ═══════════════════════════════════════════════════════════════════ */
function viewRueckblick(){
  const n = S.settings.rueckZeit ?? 90;
  const wahl = `<div class="chipbar">
    ${Object.entries(ZEITRAEUME).map(([k,l]) =>
      `<button class="chip ${(+k)===n?'on':''}" data-rz="${k}">${l}</button>`).join('')}
  </div>`;

  const saetze = erkenntnisse(n);

  if(!saetze.length){
    return wahl + `<div class="void-s">
      <div class="void-r"></div>
      <div class="void-h">Noch zu früh</div>
      <p class="void-p">Der Rückblick braucht ein paar Wochen Nutzung, bevor er etwas sagen kann, das du nicht schon weißt. Bis dahin schweigt er lieber.</p>
    </div>`;
  }

  return wahl + `<div class="erk">
    ${saetze.map((x,i) => `<div class="erk-s ${x.art||''}" style="animation-delay:${i*70}ms">
      <div class="erk-t">${x.text}</div>
      ${x.beleg ? `<div class="erk-b">${x.beleg}</div>` : ''}
      ${x.balken || ''}
    </div>`).join('')}
  </div>`;
}

/** Baut die Aussagen. Jede prüft selbst, ob sie belegt ist. */
function erkenntnisse(n){
  const out = [];
  const zahl = (k, ein, mehr) => k === 0 ? `keinem ${ein}`
    : k === 1 ? `einem ${ein}` : `<b>${k}</b> ${mehr}`;
  const raum = n ? `in ${n} Tagen` : 'insgesamt';
  const B = b => `<b>${esc(b.name)}</b>`;

  // ── Verteilung der Aufmerksamkeit — die wichtigste Aussage ──
  const auf = aufmerksamkeit(n).filter(x => S.items.some(i => i.bereich === x.b.id));
  const mitTagen = auf.filter(x => x.tage > 0);
  if(auf.length >= 2 && mitTagen.length){
    const o = auf[0], u = auf[auf.length-1];
    const max = Math.max(...auf.map(x => x.tage), 1);
    out.push({
      text: o.tage === u.tage
        ? `Deine Bereiche haben ${raum} etwa gleich viel Bewegung bekommen.`
        : `${B(o.b)} hat ${raum} an ${zahl(o.tage,'Tag','Tagen')} Bewegung bekommen, ${B(u.b)} an ${zahl(u.tage,'Tag','Tagen')}.`,
      balken: `<div class="erk-bal">${auf.map(x => `
        <div class="erk-bz">
          <span class="erk-bn">${esc(x.b.name)}</span>
          <span class="erk-bb"><i style="width:${Math.round(x.tage/max*100)}%;background:${bFarbe(x.b.ci)}"></i></span>
          <span class="erk-bw">${x.tage}</span>
        </div>`).join('')}</div>`,
    });
  }

  // ── Was fertig geworden ist ──
  const ab = abschluesse(n);
  if(ab.length){
    const proB = {};
    ab.forEach(i => { proB[i.bereich] = (proB[i.bereich]||0) + 1; });
    const top = Object.entries(proB).sort((a,b) => b[1]-a[1])[0];
    const tb = bereich(top[0]);
    out.push({
      text: `<b>${ab.length} ${ab.length===1?'Vorhaben ist':'Vorhaben sind'}</b> ${raum} fertig geworden${
        tb && Object.keys(proB).length > 1 ? `, ${top[1]} davon in ${B(tb)}` : ''}.`,
      beleg: ab.slice(-3).reverse().map(i => esc(i.title)).join(' · '),
    });
  } else if(n && Object.keys(S.tage||{}).length >= 10){
    // Nur wenn genug Historie da ist — sonst wäre es kein Befund, nur ein Vorwurf
    out.push({ text: `${raum.charAt(0).toUpperCase()+raum.slice(1)} ist kein Vorhaben fertig geworden.`, art:'still' });
  }

  // ── Durchlaufzeit ──
  const d = durchlauf(n);
  if(d.genug){
    out.push({
      text: d.trend === 'gleich'
        ? `Was du abschließt, dauert im Schnitt <b>${d.mittel} Tage</b>.`
        : `Was du abschließt, dauert im Schnitt <b>${d.mittel} Tage</b> — bei den letzten drei waren es ${d.letztesMittel}.`,
      beleg: `${d.faelle} abgeschlossene Vorhaben · die Hälfte war in ${d.median} Tagen fertig`,
    });
  } else if(d.faelle > 0){
    out.push({
      text: `Für eine Aussage über deine Durchlaufzeiten ist es noch zu früh — ${d.faelle} abgeschlossene ${d.faelle===1?'Vorhaben genügt':'Vorhaben genügen'} nicht.`,
      art: 'zufrueh',
    });
  }

  // ── Aufschub: gemacht gegen liegengeblieben ──
  const a = aufschub();
  if(a.gesamt >= 2){
    out.push({
      text: `Du hast <b>${a.gesamt} Vorhaben</b> mehrfach verschoben. ${
        a.gemacht ? `${a.gemacht} davon ${a.gemacht===1?'ist':'sind'} inzwischen fertig.` : 'Keines ist bisher fertig geworden.'}`,
      beleg: a.offen.length
        ? a.offen.slice(0,2).map(i =>
            `${esc(i.title)} — ${i.postponed}× verschoben, seit ${tageSeit(i.beruehrt)} Tagen unbewegt`).join('<br>')
        : '',
    });
  }

  // ── Rhythmus ──
  const r = rhythmus(n);
  if(r.tage >= 3){
    out.push({
      text: `Du hast ${raum} an <b>${r.tage} von ${r.spanne} Tagen</b> etwas bewegt.`,
      beleg: r.anteil >= .5 ? 'etwa jeden zweiten Tag'
           : r.anteil >= .25 ? 'etwa jeden vierten Tag'
           : 'in Schüben, mit längeren Pausen',
    });
  }

  // ── Reihen: Entwicklung, wenn belegt ──
  reihen().forEach(r => {
    const bil = reiheBilanz(r);
    if(!r.einheit || !bil.entwicklung || bil.entwicklung.richtung === 'gleich') return;
    const auf = bil.entwicklung.richtung === 'hoch';
    out.push({
      text: `Bei <b>${esc(r.title)}</b> liegst du zuletzt im Schnitt bei <b>${bil.entwicklung.spaet} ${esc(r.einheit)}</b>, anfangs waren es ${bil.entwicklung.frueh}.`,
      beleg: `${bil.eingetragen} von ${bil.faellig} fälligen Tagen eingetragen`,
    });
  });

  // ── Was still liegt, und ob es ein Muster ist ──
  const st = laengstStill();
  if(st && st.t >= 10){
    out.push({
      text: `${B(st.b)} liegt am längsten still — <b>${st.t} Tage</b>.${
        st.muster ? ' Das war im Zeitraum davor auch so.' : ''}`,
      art: 'still',
    });
  }

  return out;
}

function viewReihen(){

    ? `<div class="strand"><div class="shead"><span>Laufend</span></div>${laufend.map(reiheHTML).join('')}</div>` : '';

        ${vorbei.map(r => offen[r.id] ? reiheHTML(r) : reiheKurz(r)).join('')}</div>` : '';

  return lauf + alt;
}

/* ═══════════════════════════════════════════════════════════════════
   SUCHE
   
   Durchsucht Titel, Nachweis, Schritte und Bereichsnamen. Ohne
   Eingabe zeigt sie, was zuletzt bewegt wurde — dann ist sie auch
   ein Weg zurück zur letzten Arbeit.
   ═══════════════════════════════════════════════════════════════════ */
let suchSel = 0, suchTreffer = [];

function normal(t){
  return (t||'').toLowerCase()
    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');
}

function hebHervor(text, q){
  if(!q) return esc(text);
  const n = normal(text), nq = normal(q);
  const i = n.indexOf(nq);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}

function suchen(q){
  const nq = normal(q.trim());
  if(!nq){
    // Ohne Eingabe: zuletzt Bewegtes — der Weg zurück in die letzte Arbeit
    return S.items
      .filter(i => !i.archived)
      .sort((a,b) => (b.beruehrt||'').localeCompare(a.beruehrt||''))
      .slice(0,8)
      .map(i => ({typ:'item', it:i, punkte:0}));
  }
  const out = [];
  S.bereiche.forEach(b => {
    if(normal(b.name).includes(nq)) out.push({typ:'bereich', b, punkte:6});
    if(istProjekt(b) && normal(b.projekt.ziel||'').includes(nq))
      out.push({typ:'bereich', b, punkte:3});
    (b.meilensteine||[]).forEach(m => {
      if(normal(m.text).includes(nq)) out.push({typ:'ms', b, m, punkte:3});
    });
    (b.ziele||[]).forEach(z => {
      if(normal(z.titel).includes(nq)) out.push({typ:'ziel', b, z, punkte:5});
      (z.meilensteine||[]).forEach(m => {
        if(normal(m.text).includes(nq)) out.push({typ:'ms', b, m, punkte:3});
      });
    });
  });
  S.items.forEach(i => {
    if(i.archived) return;
    if(i.kind === 'reihe'){
      if(normal(i.title).includes(nq)) out.push({typ:'item', it:i, punkte: normal(i.title).startsWith(nq)?5:4});
      return;
    }
    let p = 0, wo = null;
    if(normal(i.title).includes(nq)){ p = normal(i.title).startsWith(nq) ? 5 : 4; wo = null; }
    else if(normal(i.proof).includes(nq)){ p = 2; wo = i.proof; }
    else {
      const st = (i.steps||[]).find(x => normal(x.text).includes(nq));
      if(st){ p = 1; wo = st.text; }
    }
    if(p) out.push({typ:'item', it:i, punkte:p, fund:wo});
  });
  return out.sort((a,b) => b.punkte - a.punkte).slice(0,40);
}

function renderSuche(){
  const q = $('#such-q').value;
  suchTreffer = suchen(q);
  suchSel = clamp(suchSel, 0, Math.max(0, suchTreffer.length-1));
  const box = $('#such-body');

  if(!suchTreffer.length){
    box.innerHTML = `<div class="such-leer">Nichts gefunden für „${esc(q)}"</div>`;
    return;
  }

  let html = '', letzte = null;
  suchTreffer.forEach((t, idx) => {
    const grp = t.typ === 'bereich' ? 'Bereiche'
              : !q.trim()            ? 'Zuletzt bewegt'
              : t.typ === 'ziel'     ? 'Ziele'
              : t.typ === 'ms'       ? 'Meilensteine'
              : t.it.doneAt          ? 'Abgeschlossen'
              : t.it.kind === 'klein'? 'Kleinkram' : 'Einsätze';
    if(grp !== letzte){ html += `<div class="such-grp">${grp}</div>`; letzte = grp; }

    if(t.typ === 'ziel'){
      const f = zielFortschritt(t.b.id, t.z.id);
      html += `<div class="such-i ${t.z.zustand==='fertig'?'erl':''} ${idx===suchSel?'sel':''}" data-sidx="${idx}">
        <i style="background:${bFarbe(t.b.ci)}"></i>
        <div><div class="such-t">${hebHervor(t.z.titel, q)}</div>
        <div class="such-m">Ziel<span class="sep"></span>${esc(t.b.name)}<span class="sep"></span>${
          Z_ZUSTAND[t.z.zustand]}${f.offen?`<span class="sep"></span>${f.offen} offen`:''}</div></div>
      </div>`;
      return;
    }
    if(t.typ === 'ms'){
      html += `<div class="such-i ${t.m.erreicht?'erl':''} ${idx===suchSel?'sel':''}" data-sidx="${idx}">
        <i style="background:${t.m.erreicht?'var(--calm)':bFarbe(t.b.ci)}"></i>
        <div><div class="such-t">${hebHervor(t.m.text, q)}</div>
        <div class="such-m">Meilenstein<span class="sep"></span>${esc(t.b.name)}${
          t.m.datum ? `<span class="sep"></span>${dfmtLang(t.m.datum)}` : ''}</div></div>
      </div>`;
      return;
    }
    if(t.typ === 'bereich'){
      const n = einsaetze().filter(i => i.bereich === t.b.id && !i.doneAt).length;
      html += `<div class="such-i ${idx===suchSel?'sel':''}" data-sidx="${idx}">
        <i style="background:${bFarbe(t.b.ci)}"></i>
        <div><div class="such-t">${hebHervor(t.b.name, q)}</div>
        <div class="such-m">${n} offene Einsätze<span class="sep"></span>${seitText(bereichBeruehrt(t.b.id))}</div></div>
      </div>`;
      return;
    }

    const it = t.it;
    const b = it.bereich ? bereich(it.bereich) : null;
    const m = [];
    if(b) m.push(esc(b.name));
    else if(it.kind === 'klein') m.push('Kleinkram');
    if(it.aktiv && !it.doneAt) m.push('läuft');
  if(it.wdh && it.wdh !== 'nie') m.push(WDH[it.wdh].toLowerCase());
  if(it.kind === 'reihe') m.push(reiheLaeuft(it) ? 'läuft' : it.bis < todayISO() ? 'beendet' : 'kommend');
    if(it.due) m.push(dueLabel(it.due));
    m.push(seitText(it.beruehrt));

    html += `<div class="such-i ${it.doneAt?'erl':''} ${idx===suchSel?'sel':''}" data-sidx="${idx}">
      <i style="background:${b ? bFarbe(b.ci) : 'var(--ink3)'}"></i>
      <div style="min-width:0">
        <div class="such-t">${hebHervor(it.title, q)}</div>
        ${t.fund ? `<div class="such-m" style="color:var(--ink2)">${hebHervor(t.fund, q)}</div>` : ''}
        <div class="such-m">${m.join('<span class="sep"></span>')}</div>
      </div>
    </div>`;
  });
  box.innerHTML = html;
  box.querySelector('.such-i.sel')?.scrollIntoView({block:'nearest'});
}

/* ═══════════════════════════════════════════════════════════════════
   REIHENANSICHT · Kachelraster
   ═══════════════════════════════════════════════════════════════════ */
function reiheHTML(r){
  const tage = reiheTage(r);
  const heute = todayISO();
  const b = r.bereich ? bereich(r.bereich) : null;
  const bil = reiheBilanz(r);

  const kacheln = tage.map((t, i) => {
    const w = reiheWert(r, t);
    const hat = w !== undefined;
    const zukunft = t > heute;
    const istHeute = t === heute;
    const zielOk = r.tagesziel && typeof w === 'number' && w >= r.tagesziel;
    const d = new Date(t + 'T00:00');
    const beschr = `${d.getDate()}. ${d.getMonth()+1}.` +
      (hat ? (typeof w === 'number' ? `, ${w} ${esc(r.einheit)} eingetragen` : ', erledigt') : ', nicht eingetragen');
    return `<button class="rk ${hat?'voll':''} ${zukunft?'spaeter':''} ${istHeute?'heute':''} ${zielOk?'ziel':''}"
              data-rt="${r.id}:${t}" style="--i:${i}" ${zukunft?'disabled':''}
              aria-label="${beschr}" aria-pressed="${hat}">
      <span class="rk-d">${d.getDate()}</span>
      <span class="rk-w">${hat ? (typeof w === 'number' ? w : svg('check')) : ''}</span>
    </button>`;
  }).join('');

  // Wochentagsköpfe nur bei täglichem Takt sinnvoll
  const voll = (r.takt||[]).length === 7;

  return `<div class="reihe" data-r="${r.id}">
    <div class="rh">
      <div class="rh-b">
        <div class="rh-t">${esc(r.title)}</div>
        <div class="rh-m">
          ${dfmtLang(r.von)} → ${dfmtLang(r.bis)}
          ${!voll ? `<span class="sep"></span>${(r.takt||[]).map(d=>WOCHENTAGE[d]).join(' ')}` : ''}
          ${r.einheit ? `<span class="sep"></span>${esc(r.einheit)}` : ''}
          ${r.tagesziel ? `<span class="sep"></span>Ziel ${r.tagesziel}` : ''}
          ${b ? `<span class="sep"></span>${esc(b.name)}` : ''}
        </div>
      </div>
      <button class="mini" data-rbearb="${r.id}">${svg('pencil')}</button>
    </div>

    <div class="rgrid">${kacheln}</div>

    <div class="rbil">
      ${r.einheit ? `<span><b>${bil.summe}</b> ${esc(r.einheit)} insgesamt</span>
        ${bil.schnitt ? `<span class="sep"></span><span>Schnitt <b>${bil.schnitt}</b></span>` : ''}`
      : `<span><b>${bil.eingetragen}</b> von ${bil.faellig} Tagen eingetragen</span>`}
      ${r.einheit && bil.eingetragen ? `<span class="sep"></span><span>${bil.eingetragen} Tage</span>` : ''}
    </div>

    ${bil.entwicklung && bil.entwicklung.richtung !== 'gleich' ? `
      <div class="rentw">
        ${bil.entwicklung.richtung === 'hoch'
          ? `Zuletzt im Schnitt <b>${bil.entwicklung.spaet}</b>, anfangs ${bil.entwicklung.frueh}.`
          : `Zuletzt im Schnitt <b>${bil.entwicklung.spaet}</b>, anfangs waren es ${bil.entwicklung.frueh}.`}
      </div>` : ''}
  </div>`;
}

/** Eingeklappte Zeile einer beendeten Reihe — Bilanz statt Kachelraster. */
function reiheKurz(r){
  const bil = reiheBilanz(r);
  const b = r.bereich ? bereich(r.bereich) : null;
  const kern = r.einheit
    ? `<b>${bil.summe}</b> ${esc(r.einheit)}${bil.schnitt?` · Schnitt ${bil.schnitt}`:''}`
    : `<b>${bil.eingetragen}</b> von ${bil.faellig} Tagen`;
  return `<div class="rkurz" data-raus="${r.id}">
    <div class="rkurz-b">
      <div class="rkurz-t">${esc(r.title)}</div>
      <div class="rkurz-m">
        <span>${dfmtLang(r.von)} → ${dfmtLang(r.bis)}</span>
        ${b ? `<span class="sep"></span><span>${esc(b.name)}</span>` : ''}
      </div>
      <div class="rkurz-z">${kern}</div>
    </div>
    <span class="rkurz-c">${svg('right')}</span>
  </div>`;
}

/** Kompakte Zeile für die Heute-Ansicht — Eingabe ohne Umweg. */
function reiheHeuteZeile(r){
  const t = todayISO();
  const w = reiheWert(r, t);
  const hat = w !== undefined;
  const b = r.bereich ? bereich(r.bereich) : null;
  return `<div class="rz ${hat?'voll':''}">
    <button class="rz-k" data-rt="${r.id}:${t}" aria-label="Eintragen">
      ${hat ? (typeof w === 'number' ? `<b>${w}</b>` : svg('check')) : svg('plus')}
    </button>
    <div class="rz-b" data-ropen="${r.id}">
      <div class="rz-t">${esc(r.title)}</div>
      <div class="rz-m">${r.einheit ? esc(r.einheit) : 'erledigen'}${
        r.tagesziel ? ` · Ziel ${r.tagesziel}` : ''}${b ? ` · ${esc(b.name)}` : ''}</div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   FOKUS
   ═══════════════════════════════════════════════════════════════════ */
let fxID = null, fxSec = 0, fxRun = false, fxTimer = null;

function openFocus(id){
  const it = item(id); if(!it) return;
  fxID = id; fxSec = it.trk || 0; fxRun = false;
  $('#focus').classList.add('on');
  document.body.style.overflow = 'hidden';
  renderFocus();
}
function closeFocus(){
  stopFx(); fxID = null;
  $('#focus').classList.remove('on');
  document.body.style.overflow = '';
  render();
}
function stopFx(){
  clearInterval(fxTimer); fxTimer = null;
  if(!fxRun) return;
  fxRun = false;
  const it = item(fxID);
  if(it){ it.trk = fxSec; if(!it.startedAt) it.startedAt = new Date().toISOString(); beruehre(it); persist(); }
}
function toggleFx(){
  if(fxRun) stopFx();
  else {
    fxRun = true;
    const it = item(fxID);
    if(it && !it.startedAt){ it.startedAt = new Date().toISOString(); beruehre(it); persist(); }
    fxTimer = setInterval(() => {
      fxSec++;
      const el = $('#fxc'); if(el) el.textContent = fxTime();
    }, 1000);
  }
  renderFocus();
}
function fxTime(){
  const h = Math.floor(fxSec/3600), m = Math.floor(fxSec%3600/60), s = fxSec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderFocus(){
  const it = item(fxID);
  if(!it){ closeFocus(); return; }
  const b = it.bereich ? bereich(it.bereich) : null;
  const nx = naechsterSchritt(it);

  $('#focus').innerHTML = `
    <div class="fx-top">
      <span class="fx-l" style="${b?`color:${bFarbe(b.ci)}`:''}">${b ? esc(b.name) : 'Kleinkram'}</span>
      <button class="tbtn" data-fxclose="1" aria-label="Verlassen">${svg('x')}</button>
    </div>
    <div class="fx-mid">
      <h1 class="fx-t">${esc(it.title)}</h1>
      ${it.proof ? `<p class="fx-p">Fertig, wenn ich <b>${esc(it.proof)}</b>${/[.!?]$/.test(it.proof)?'':'.'}</p>` : ''}
      <div class="fx-c ${fxRun?'run':''}" id="fxc">${fxTime()}</div>
      <div class="fx-h">${fxRun ? 'läuft' : 'gestoppt'}</div>
      ${(it.steps||[]).length ? `<div class="fx-s">${it.steps.map(s => `
        <div class="fx-i ${s.done?'done':''} ${nx&&nx.id===s.id?'next':''}" data-fxstep="${s.id}">
          <span class="orb ${s.done?'on':''}">${svg('check')}</span>
          <span>${esc(s.text)}</span>
        </div>`).join('')}</div>` : ''}
    </div>
    <div class="fx-bot">
      <button class="big" data-fxtoggle="1">${svg(fxRun?'pause':'play')}${fxRun?'Anhalten':'Starten'}</button>
      <button class="ghost" data-fxdone="1">${svg('check')}Abschließen</button>
    </div>`;
}



/* ═══════════════════════════════════════════════════════════════════
   AKTIONEN
   ═══════════════════════════════════════════════════════════════════ */
/** Wiederkehrende Vorhaben erzeugen beim Abschluss ihre nächste Instanz. */
function naechsteWiederholung(it){
  const tage = WDH_TAGE[it.wdh];
  if(!tage) return null;
  const basis = it.due || todayISO();
  const d = new Date(basis + 'T00:00'); d.setDate(d.getDate() + tage);
  const neu = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const kopie = {
    ...JSON.parse(JSON.stringify(it)),
    id: uid(), due: neu, lastDue: neu,
    trk: 0, heute: false, heuteTag: null,
    doneAt: null, startedAt: null, postponed: 0,
    createdAt: new Date().toISOString(), beruehrt: new Date().toISOString(),
    aktiv: it.kind === 'einsatz' && !aktiverEinsatz(it.bereich),
    steps: (it.steps||[]).map(x => ({ id: uid(), text: x.text, done: false })),
  };
  S.items.push(kopie);
  setTimeout(() => say(`Nächste Wiederholung für ${dueLabel(neu)} angelegt`, 'ok'), 700);
  return kopie;
}

function erledige(id){
  const it = item(id);
  if(!it || it.doneAt) return;
  it.doneAt = new Date().toISOString();
  if(!it.startedAt) it.startedAt = it.createdAt;
  beruehre(it);
  // Ein abgeschlossener Einsatz gibt seinen Platz frei
  if(it.kind === 'einsatz') it.aktiv = false;
  const folge = naechsteWiederholung(it);
  persist(); render();
  const b = it.bereich ? bereich(it.bereich) : null;
  const rest = b ? wartende(b.id) : [];
  say('Erledigt', 'ok', {label:'Rückgängig', fn:() => {
    it.doneAt = null; if(it.kind==='einsatz' && !aktiverEinsatz(it.bereich)) it.aktiv = true;
    persist(); render();
  }});
  if(b && rest.length && !aktiverEinsatz(b.id)){
    setTimeout(() => say(`${esc(b.name)}: nächsten Einsatz wählen?`, 'ok',
      {label:'Wählen', fn:() => oeffneWechsel(b.id)}), 900);
  }
}

function zurueck(id){
  const it = item(id); if(!it) return;
  it.doneAt = null; beruehre(it); persist(); render();
}

function toggleHeute(id){
  const it = item(id); if(!it) return;
  const on = istHeute(it);
  it.heute = !on; it.heuteTag = on ? null : todayISO();
  beruehre(it); persist(); render();
}

function toggleSchritt(itemID, stepID){
  const it = item(itemID); if(!it) return;
  const s = (it.steps||[]).find(x => x.id === stepID); if(!s) return;
  s.done = !s.done; beruehre(it); persist();
  if(sheetMode === 'detail' && sheetID === itemID) renderDetail();
  if(fxID === itemID) renderFocus();
  render();
  if(it.steps.length && it.steps.every(x => x.done) && !it.doneAt){
    say('Alle Schritte erledigt', 'ok', {label:'Abschließen', fn:() => {
      if(fxID === itemID) closeFocus();
      erledige(itemID);
    }});
  }
}

function loesche(id){
  const i = S.items.findIndex(x => x.id === id); if(i < 0) return;
  const snap = JSON.parse(JSON.stringify(S.items[i]));
  S.items.splice(i,1); persist(); render();
  say('Gelöscht', 'warn', {label:'Rückgängig', fn:() => { S.items.push(snap); persist(); render(); }});
}

function loescheBereich(id){
  const b = bereich(id); if(!b) return;
  const snapB = JSON.parse(JSON.stringify(b));
  const snapI = S.items.filter(i => i.bereich === id).map(i => JSON.parse(JSON.stringify(i)));
  S.bereiche = S.bereiche.filter(x => x.id !== id);
  S.items = S.items.filter(i => i.bereich !== id);
  persist(); render();
  say(`„${b.name}" gelöscht`, 'warn', {label:'Rückgängig', fn:() => {
    S.bereiche.push(snapB); snapI.forEach(i => S.items.push(i)); persist(); render();
  }});
}

/** Einen Einsatz zum aktiven des Bereichs machen — verdrängt den bisherigen. */
function setzeAktiv(id){
  const it = item(id); if(!it || it.kind !== 'einsatz' || !it.bereich) return;
  einsaetze().filter(x => x.bereich === it.bereich).forEach(x => x.aktiv = false);
  it.aktiv = true; beruehre(it); persist(); render();
}

/* ═══════════════════════════════════════════════════════════════════
   BLATT
   ═══════════════════════════════════════════════════════════════════ */
let sheetMode = null, sheetID = null, C = null, wechselB = null;

function openSheet(mode, id){
  sheetMode = mode; sheetID = id || null;
  $('#veil').classList.add('on'); $('#sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
  if(mode === 'neu')     renderCompose();
  if(mode === 'detail')  renderDetail();
  if(mode === 'wechsel') renderWechsel();
  if(mode === 'projekt') renderProjekt();
  if(mode === 'reihe')   renderReiheBlatt();
  if(mode === 'ziel')    renderZielBlatt();
}
function closeSheet(){
  if(sheetMode === 'detail') commitDetail();
  sheetMode = null; sheetID = null; C = null; wechselB = null;
  $('#veil').classList.remove('on'); $('#sheet').classList.remove('on');
  document.body.style.overflow = '';
  render();
}

      const p = el.selectionStart; renderCompose();
      const again = $('#f-'+k);
      if(again){ again.focus(); try{ again.setSelectionRange(p,p); }catch{} }
    });

function grow(el){
  const fit = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
  el.addEventListener('input', fit); fit();
}

/**
 * Ein Satz im Moment der Entscheidung. Keine Warnung, keine Sperre —
 * nur die Tatsache. Erscheint nur, wenn es tatsächlich etwas zu sagen gibt.
 */
function lageSatz(){
  const laufend = einsaetze().filter(i => i.aktiv && !i.doneAt).length;
  const fertig30 = abschluesse(30).length;
  if(laufend < 3) return '';
  if(fertig30 >= laufend) return '';
  return `<div class="lage-s">${svg('rueck')}<span>Du hast <b>${laufend} laufende
    ${laufend===1?'Einsatz':'Einsätze'}</b>. In den letzten 30 Tagen ${
    fertig30 === 0 ? 'ist keiner fertig geworden' :
    fertig30 === 1 ? 'ist einer fertig geworden' : `sind ${fertig30} fertig geworden`}.</span></div>`;
}

function erstelle(){
  if(!C) return;
  const title = C.title.trim(); if(!title) return;
  if(checkTitle(title).s === 'weak' && !C.forced){
    C.forced = true; renderCompose();
    if(navigator.vibrate) navigator.vibrate(16);
    return;
  }
  const bid = C.bereich || sortBereiche()[0]?.id;
  if(!bid){ say('Lege zuerst einen Bereich an.', 'warn'); return; }

  const it = neuerEinsatz({
    bereich: bid, title,
    proof: C.proof.trim(),
    steps: C.step.trim() ? [{id:uid(), text:C.step.trim(), done:false}] : [],
    aktiv: false,
    ziel: C.zielId || null,
    von: C.von || null, bis: C.bis || null,
  });
  S.items.push(it);
  if(C.aktivSetzen) setzeAktiv(it.id);
  persist(); C = null; closeSheet();
  const b = bereich(bid);
  say(`Angelegt in ${b?b.name:'Bereich'}`, 'ok', {label:'Öffnen', fn:() => openSheet('detail', it.id)});
}
